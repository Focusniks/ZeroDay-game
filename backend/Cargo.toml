[package]
name = "zeroday-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "zeroday_backend"
path = "src/lib.rs"

[[bin]]
name = "zeroday-backend"
path = "src/main.rs"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
anyhow = "1"
bcrypt = "0.16"
dotenvy = "0.15"
env_logger = "0.11"
futures-util = "0.3"
jsonwebtoken = "9"
log = "0.4"
mime_guess = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-tungstenite = "0.26"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"

