<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroDay Messenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
        }
        
        .messenger-container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Sidebar */
        .sidebar {
            width: 320px;
            background: rgba(30, 41, 59, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .sidebar-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .search-box {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-input:focus {
            border-color: #3b82f6;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .conversation-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .conversation-item:hover {
            background: rgba(51, 65, 85, 0.3);
        }
        
        .conversation-item.active {
            background: rgba(59, 130, 246, 0.2);
            border-left: 3px solid #3b82f6;
        }
        
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        
        .conversation-info {
            flex: 1;
            min-width: 0;
        }
        
        .conversation-name {
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-preview {
            font-size: 0.85rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.5);
        }
        
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 70%;
        }
        
        .message.own {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        
        .message-content {
            background: rgba(51, 65, 85, 0.8);
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }
        
        .message.own .message-content {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 4px;
        }
        
        .message-text {
            line-height: 1.5;
        }
        
        .message-time {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 5px;
            text-align: right;
        }
        
        /* Message input */
        .message-input-container {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .message-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .message-input {
            flex: 1;
            padding: 12px 20px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            color: #f1f5f9;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .message-input:focus {
            border-color: #3b82f6;
        }
        
        .send-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .send-button:hover {
            transform: scale(1.05);
        }
        
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            color: #64748b;
        }
        
        .empty-state-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(51, 65, 85, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Setup screen */
        .setup-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .setup-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        
        .setup-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .setup-card p {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #3b82f6;
        }
        
        .setup-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .setup-button:hover {
            transform: translateY(-2px);
        }
        
        .setup-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        // ZeroDay Messenger - Client-side application
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        let token = localStorage.getItem('zeroday.token');
        let profile = null;
        let conversations = [];
        let activeConversation = null;
        let messages = [];
        
        function getToken() {
            return localStorage.getItem('zeroday.token');
        }
        
        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers,
                },
            });
            
            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }
            
            return response.json();
        }
        
        async function checkProfile() {
            try {
                const result = await apiRequest('/messenger/profile');
                if (result.ok && result.profile) {
                    profile = result.profile;
                    return true;
                }
            } catch (e) {
                console.log('No profile found');
            }
            return false;
        }
        
        function renderSetupScreen() {
            document.getElementById('app').innerHTML = `
                <div class="setup-screen">
                    <div class="setup-card">
                        <h2>🚀 ZeroDay Messenger</h2>
                        <p>Создайте свой профиль для начала общения</p>
                        <form id="setup-form">
                            <div class="form-group">
                                <label>Уникальное имя (@username)</label>
                                <input type="text" id="messenger-id" placeholder="username" required pattern="[a-z0-9_]+" minlength="3" maxlength="20">
                            </div>
                            <div class="form-group">
                                <label>Отображаемое имя</label>
                                <input type="text" id="display-name" placeholder="Как вас называть" required>
                            </div>
                            <div class="form-group">
                                <label>О себе</label>
                                <input type="text" id="about" placeholder="Расскажите немного о себе">
                            </div>
                            <button type="submit" class="setup-button">Создать профиль</button>
                        </form>
                    </div>
                </div>
            `;
            
            document.getElementById('setup-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const button = e.target.querySelector('button');
                button.disabled = true;
                button.textContent = 'Создание...';
                
                try {
                    await apiRequest('/messenger/profile', {
                        method: 'POST',
                        body: JSON.stringify({
                            messenger_id: document.getElementById('messenger-id').value,
                            display_name: document.getElementById('display-name').value,
                            about: document.getElementById('about').value || null,
                        }),
                    });
                    
                    await loadMessenger();
                } catch (err) {
                    alert('Ошибка: ' + err.message);
                    button.disabled = false;
                    button.textContent = 'Создать профиль';
                }
            });
        }
        
        async function loadConversations() {
            try {
                const result = await apiRequest('/messenger/conversations');
                if (result.ok) {
                    conversations = result.conversations || [];
                    renderConversations();
                }
            } catch (e) {
                console.error('Failed to load conversations:', e);
            }
        }
        
        function renderConversations() {
            const list = document.querySelector('.conversations-list');
            if (!list) return;
            
            if (conversations.length === 0) {
                list.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b;">Нет чатов</div>';
                return;
            }
            
            list.innerHTML = conversations.map(conv => {
                const name = conv.is_group ? conv.name : conv.other_user?.username || 'Неизвестный';
                const lastMsg = conv.last_message;
                return `
                    <div class="conversation-item ${activeConversation?.id === conv.id ? 'active' : ''}" 
                         data-id="${conv.id}">
                        <div class="avatar">${name[0]?.toUpperCase() || '?'}</div>
                        <div class="conversation-info">
                            <div class="conversation-name">${name}</div>
                            <div class="conversation-preview">
                                ${lastMsg ? lastMsg.content : 'Нет сообщений'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            list.querySelectorAll('.conversation-item').forEach(item => {
                item.addEventListener('click', () => selectConversation(item.dataset.id));
            });
        }
        
        async function selectConversation(convId) {
            activeConversation = conversations.find(c => c.id === convId);
            renderConversations();
            
            try {
                const result = await apiRequest(`/messenger/conversations/${convId}/messages?limit=50`);
                if (result.ok) {
                    messages = result.messages || [];
                    renderMessages();
                }
            } catch (e) {
                console.error('Failed to load messages:', e);
            }
        }
        
        function renderMessages() {
            const container = document.querySelector('.chat-messages');
            if (!container) return;
            
            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><p>Начните общение</p></div>';
                return;
            }
            
            container.innerHTML = messages.map(msg => {
                const isOwn = msg.sender_id === profile.user_id;
                const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="message ${isOwn ? 'own' : ''}">
                        <div class="message-content">
                            <div class="message-text">${escapeHtml(msg.content)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content || !activeConversation) return;
            
            try {
                await apiRequest(`/messenger/conversations/${activeConversation.id}/messages`, {
                    method: 'POST',
                    body: JSON.stringify({ content }),
                });
                
                input.value = '';
                await selectConversation(activeConversation.id);
            } catch (e) {
                alert('Ошибка отправки: ' + e.message);
            }
        }
        
        function renderMainScreen() {
            document.getElementById('app').innerHTML = `
                <div class="messenger-container">
                    <div class="sidebar">
                        <div class="sidebar-header">
                            <h1>💬 Messenger</h1>
                        </div>
                        <div class="search-box">
                            <input type="text" class="search-input" placeholder="Поиск чатов..." id="chat-search">
                        </div>
                        <div class="conversations-list"></div>
                    </div>
                    <div class="chat-area">
                        <div class="chat-header">
                            <div class="avatar" id="chat-avatar">?</div>
                            <div>
                                <h3 id="chat-name">Выберите чат</h3>
                            </div>
                        </div>
                        <div class="chat-messages">
                            <div class="empty-state">
                                <div class="empty-state-icon">💬</div>
                                <p>Выберите чат для начала общения</p>
                            </div>
                        </div>
                        <div class="message-input-container">
                            <div class="message-input-wrapper">
                                <input type="text" class="message-input" id="message-input" placeholder="Напишите сообщение..." disabled>
                                <button class="send-button" id="send-button" disabled>
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('chat-search').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                document.querySelectorAll('.conversation-item').forEach(item => {
                    const name = item.querySelector('.conversation-name').textContent.toLowerCase();
                    item.style.display = name.includes(query) ? '' : 'none';
                });
            });
            
            document.getElementById('message-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            document.getElementById('send-button').addEventListener('click', sendMessage);
            
            document.getElementById('message-input').addEventListener('input', (e) => {
                document.getElementById('send-button').disabled = !e.target.value.trim();
            });
            
            loadConversations();
        }
        
        async function loadMessenger() {
            const hasProfile = await checkProfile();
            if (!hasProfile) {
                renderSetupScreen();
            } else {
                renderMainScreen();
            }
        }
        
        // Initialize
        if (!token) {
            document.getElementById('app').innerHTML = `
                <div class="setup-screen">
                    <div class="setup-card">
                        <h2>⚠️ Ошибка</h2>
                        <p>Необходимо войти в систему</p>
                    </div>
                </div>
            `;
        } else {
            loadMessenger();
        }
    </script>
</body>
</html>
