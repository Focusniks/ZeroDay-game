                                    <div class="chat-header-status ${activeConversation.other_user?.is_online?'online':''}">
                                        ${activeConversation.other_user?.is_online ? 'онлайн' : (activeConversation.other_user?.last_seen ? formatLastSeen(activeConversation.other_user.last_seen) : 'оффлайн')}
                                    </div>
                                </div>
                                <div class="zg-header-actions">
                                    <button type="button" class="icon-btn" onclick="openChatSettings()" title="Меню чата">⋮</button>
                                </div>
                            </div>
                            <div class="load-more-wrap" id="load-more-wrap" style="display:none">
                                <button type="button" class="load-more-btn" onclick="loadOlderMessages()">Загрузить ещё</button>
                            </div>
                            <div class="messages-container" id="messages"></div>
                            <div class="typing-indicator hidden" id="typing"></div>
                            <div class="message-input-container">
                                ${pendingFile ? `
                                    <div class="file-preview">
                                        <div class="file-preview-icon">📎</div>
                                        <div class="file-preview-info">
                                            <div class="file-preview-name">${escapeHtml(pendingFile.name)}</div>
                                            <div class="file-preview-size">${formatFileSize(pendingFile.size)}</div>
                                        </div>
                                        <button class="file-preview-remove" onclick="clearPendingFile()">✕</button>
                                    </div>
                                ` : ''}
                                <div class="message-input-wrapper">
                                    <div class="input-actions">
                                        <button class="input-action-btn" onclick="attachFileClick()" title="Прикрепить файл">📎</button>
                                        <button class="input-action-btn" onclick="toggleEmojiPicker()" title="Эмодзи">😊</button>
                                    </div>
                                    <div class="message-input-box tg-selectable" contenteditable placeholder="Написать сообщение…" oninput="handleInput(this)" onkeydown="handleKey(event,this)"></div>
                                    <button class="send-button" id="send-btn" onclick="sendMsg()" disabled>➤</button>
                                </div>
                                ${showEmojiPicker ? `
                                    <div class="emoji-picker">
                                        ${['😀','😂','😍','🥰','😎','🤔','😢','😡','👍','👎','❤️','🔥','🎉','👋','🙏','💪'].map(e => `<button class="emoji-btn" onclick="insertEmoji('${e}')">${e}</button>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `:`
                            <div class="empty-chat">
                                <div class="empty-chat-icon" aria-hidden="true">💬</div>
                                <div class="empty-chat-text">Выберите чат в списке слева, чтобы начать переписку</div>
                            </div>
                        `}
                    </div>
                </div>`;
            if(activeConversation) renderMessages();
            renderChatList();
            updateBadge();
            updateConnectionIndicator();
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            if(!list) return;
            
            if(activeTab==='chats') {
                filteredConversations = conversations.filter(c=>{
                    const n = String(getConversationTitle(c) || '');
                    return n.toLowerCase().includes(searchQuery.toLowerCase());
                });
                
                if(filteredConversations.length===0) {
                    list.innerHTML = '<div class="zg-empty-hint">'+(searchQuery?'Ничего не найдено':'Нет чатов. Добавьте контакт через «＋»')+'</div>';
                    return;
                }
                
                list.innerHTML = filteredConversations.map(c=>{
                    const name = getConversationTitle(c);
                    const lm = c.last_message;
                    const active = activeConversation?.id===c.id;
                    const avatar = getConversationAvatarUrl(c);
                    const onlineClass = c.other_user?.is_online ? 'online' : (c.other_user ? 'offline' : '');
                    
                    return `<div class="chat-item ${active?'active':''}" onclick="selectChat('${c.id}')">
                        <div class="chat-avatar-wrap ${onlineClass}"><div class="chat-avatar">${avatar?'<img src="'+escapeHtml(avatar)+'" alt="">':getInitials(name)}</div></div>
                        <div class="chat-info">
                            <div class="chat-name-row">
                                <span class="chat-name">${escapeHtml(name)}</span>
                                <span class="chat-time">${lm?formatTime(lm.created_at):''}</span>
                            </div>
                            <div class="chat-preview">
                                <span class="chat-preview-text ${lm?.sender_id===profile?.user_id?'own':''}">${lm?(lm.sender_id!==profile?.user_id?lm.sender_username+': ':'')+lm.content:'Нет сообщений'}</span>
                                ${c.unread_count>0?'<span class="unread-badge">'+c.unread_count+'</span>':''}
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } else {
                renderContacts();
            }
        }

        function renderContacts() {
            const list = document.getElementById('chat-list');
            if(!list) return;

            let html = '';

            if (friendSearchQuery.trim().length >= 2) {
                html += '<div class="zg-section-title">Результаты поиска</div>';
                if (friendSearchLoading) {
                    html += '<div class="zg-empty-hint" style="padding:20px">Поиск…</div>';
                } else if (friendSearchResults.length === 0) {
                    html += '<div class="zg-empty-hint" style="padding:20px">Никого не найдено</div>';
                } else {
                    html += friendSearchResults.map(function(p) {
                        var avatarInner = p.avatar_url
                            ? '<img src="'+escapeHtml(p.avatar_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">'
                            : getInitials(p.display_name||'User');
                        var midEscaped = escapeHtml(String(p.messenger_id || ''));
                        var sending = friendRequestSendingMid === p.messenger_id;
                        var actionBtn = sending
                            ? '<span class="zg-pending-label">Отправка…</span>'
                            : '<button type="button" class="zg-btn-ok" onclick="event.stopPropagation();sendFriendRequestFromResults(\''+midEscaped+'\')">Добавить</button>';
                        return '<div class="zg-friend-card">'+
                            '<div class="chat-avatar" style="width:44px;height:44px;font-size:15px">'+avatarInner+'</div>'+
                            '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+escapeHtml(p.display_name)+'</div>'+
                            '<div style="font-size:12px;color:var(--zg-muted);margin-top:2px">@'+midEscaped+'</div></div>'+
                            actionBtn+
                            '</div>';
                    }).join('');
                }
            }

            if (friendActionBanner) {
                html += '<div class="zg-inline-feedback zg-inline-feedback--'+friendActionBanner.type+'">'+
                    '<span>'+escapeHtml(friendActionBanner.text)+'</span>'+
                    '<button type="button" class="zg-inline-feedback__close" onclick="clearFriendFeedback()" title="Закрыть">✕</button></div>';
            }

            if(friendRequests.length>0) {
                html += '<div class="zg-section-title">Входящие ('+friendRequests.length+')</div>';
                html += friendRequests.map(r=>`<div class="zg-friend-card">
                    <div class="chat-avatar" style="width:44px;height:44px;font-size:15px">${r.sender_avatar_url ? '<img src="'+escapeHtml(r.sender_avatar_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">' : getInitials(r.sender_display_name||'User')}</div>
                    <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${escapeHtml(r.sender_display_name)}</div><div style="font-size:12px;color:var(--zg-muted);margin-top:2px">@${escapeHtml(r.sender_messenger_id)}</div></div>
                    <div style="display:flex;gap:6px;flex-shrink:0">
                        <button type="button" class="zg-btn-ok" onclick="respondReq('${r.id}',true)">✓</button>
                        <button type="button" class="zg-btn-no" onclick="respondReq('${r.id}',false)">✕</button>
                    </div>
                </div>`).join('');
            }

            if (outgoingFriendRequests.length > 0) {
                html += '<div class="zg-section-title">Исходящие ('+outgoingFriendRequests.length+')</div>';
                html += outgoingFriendRequests.map(function(r) {
                    var rid = String(r.id);
                    var avatarInner = r.receiver_avatar_url
                        ? '<img src="'+escapeHtml(r.receiver_avatar_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">'
                        : getInitials(r.receiver_display_name||'User');
                    return '<div class="zg-friend-card">'+
                        '<div class="chat-avatar" style="width:44px;height:44px;font-size:15px">'+avatarInner+'</div>'+
                        '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+escapeHtml(r.receiver_display_name)+'</div>'+
                        '<div style="font-size:12px;color:var(--zg-muted);margin-top:2px">Ожидает ответа • @'+escapeHtml(r.receiver_messenger_id)+'</div></div>'+
                        '<button type="button" class="zg-btn-no" onclick="cancelOutgoingFriend(\''+rid.replace(/'/g, "\\'")+'\')">Отменить</button>'+
                        '</div>';
                }).join('');
            }

            html += '<div class="zg-section-title">Контакты ('+contacts.length+')</div>';

            if(contacts.length===0) {
                html += '<div class="zg-empty-hint">Нет контактов. Найдите людей через кнопку «＋»</div>';
            } else {
                html += contacts.map(c=>{
                    const onlineClass = c.is_online ? 'online' : 'offline';
                    const lastSeenText = c.is_online ? 'онлайн' : formatLastSeen(c.last_seen);
                    const avatarHtml = c.contact_avatar_url 
                        ? '<img src="'+escapeHtml(c.contact_avatar_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'
                        : getInitials(c.custom_name||c.contact_display_name||'User');
                    return `<div class="chat-item" onclick="handleContactClick('${c.contact_user_id}',true)">
                        <div class="chat-avatar-wrap ${onlineClass}"><div class="chat-avatar">${avatarHtml}</div></div>
                        <div class="chat-info">
                            <div class="chat-name">${escapeHtml(c.custom_name||c.contact_display_name)}</div>
                            <div class="chat-preview-text">@${c.contact_messenger_id} • ${lastSeenText}</div>
                        </div>
                    </div>`;
                }).join('');
            }

            list.innerHTML = html;
        }

        function renderMessages() {
            const c = document.getElementById('messages');
            if(!c) return;
            const wrap = document.getElementById('load-more-wrap');
            if (wrap) wrap.style.display = (hasMoreMessages && activeConversation && messages.length > 0) ? 'block' : 'none';

            if(messages.length===0) {
                c.innerHTML = '<div class="zg-empty-hint" style="padding:32px">Нет сообщений в этом чате.<br>Напишите первым ниже.</div>';
                return;
            }

            const convId = activeConversation ? String(activeConversation.id) : '';
            const rxMap = convId ? (messageReactions[convId] || {}) : {};

            c.innerHTML = messages.map(m=>{
                const own = m.sender_id===profile?.user_id;
                const showRead = own && m.is_read;
                
                // Получаем имя и аватарку отправителя
                let senderName = m.sender_username || 'User';
                let senderAvatar = null;
                
                // Если это не своё сообщение, ищем профиль отправителя в контактах или активном чате
                if (!own) {
                    if (activeConversation?.other_user && String(activeConversation.other_user.id) === String(m.sender_id)) {
                        const ou = activeConversation.other_user;
                        senderName = displayNameForOtherUser(ou);
                        senderAvatar = ou.avatar_url || null;
                    }
                    const contact = contacts.find(c => String(c.contact_user_id) === String(m.sender_id));
                    if (contact) {
                        const cn = contact.custom_name != null && String(contact.custom_name).trim() !== '' ? String(contact.custom_name).trim() : null;
                        senderName = cn || contact.contact_display_name || senderName;
                        senderAvatar = contact.contact_avatar_url || senderAvatar;
                    }
                } else {
                    // Своё сообщение - используем свой профиль
                    senderName = profile?.display_name || profile?.messenger_id || 'Вы';
                    senderAvatar = profile?.avatar_url;
                }
                
                const avatarContent = senderAvatar 
                    ? '<img src="'+escapeHtml(senderAvatar)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'
                    : getInitials(senderName);

                // Проверка на изображение или файл
                const isImage = m.message_type === 'image' || (m.media_url && m.media_url.match(/\.(jpg|jpeg|png|gif|webp)$/i));
                const isFile = m.message_type === 'file' || (m.media_url && !isImage);

                let contentHtml = `<div class="message-text">${escapeHtml(m.content)}${m.pending ? ' <span class="msg-pending-hint">…</span>' : ''}${!m.pending && m.edited ? '<span class="message-edited-hint">(ред.)</span>' : ''}</div>`;

                if (isImage && m.media_url) {
                    contentHtml += `<img src="${escapeHtml(m.media_url)}" class="message-image" alt="Image" onclick="viewImage('${escapeHtml(m.media_url)}')">`;
                } else if (isFile && m.media_url) {
                    const fileName = m.media_url.split('/').pop() || 'file';
                    contentHtml += `
                        <div class="message-file" onclick="downloadFile('${escapeHtml(m.media_url)}')">
                            <div class="message-file-icon">📎</div>
                            <div class="message-file-info">
                                <div class="message-file-name">${escapeHtml(fileName)}</div>
                                <div class="message-file-size">Нажмите для загрузки</div>
                            </div>
                        </div>
                    `;
                }

                const mid = String(m.id);
                const rlist = rxMap[mid] || [];
                const grouped = {};
                rlist.forEach(r => { grouped[r.emoji] = (grouped[r.emoji] || 0) + 1; });
                const reactionsHtml = Object.keys(grouped).length
                    ? '<div class="message-reactions">' + Object.entries(grouped).map(([em, cnt]) =>
                        `<span class="reaction-chip" data-mid="${mid}" data-emoji="${em.replace(/"/g, '&quot;')}" onclick="toggleReactionFromEl(this)">${escapeHtml(em)} ${cnt}</span>`
                      ).join('') + '</div>'
                    : '';
                const quickRx = !m.pending ? ['👍','❤️','🔥'].map(em =>
                    `<button type="button" class="reaction-quick" data-mid="${mid}" data-emoji="${em}" onclick="toggleReactionFromEl(this)" title="Реакция">${em}</button>`
                ).join('') : '';

                return `<div class="message ${own?'own':''} ${m.pending?'message-pending':''}" data-message-id="${escapeHtml(mid)}">
                    ${!own?'<div class="message-avatar">'+avatarContent+'</div>':''}
                    <div class="message-bubble">
                        ${!own?'<div class="message-sender">'+escapeHtml(senderName)+'</div>':''}
                        ${contentHtml}
                        ${reactionsHtml}
                        <div class="message-meta"><span class="message-time">${formatTime(m.created_at)}</span>${showRead?'<span class="message-read">✓✓</span>':''}</div>
                        <div class="message-reaction-actions">${quickRx}</div>
                    </div>
                </div>`;
            }).join('');

            c.scrollTop = c.scrollHeight;
        }

        function updateBadge() {
            const b = document.getElementById('rail-contacts-badge');
            if(b) {
                if(friendRequests.length>0) { b.textContent=friendRequests.length; b.classList.remove('hidden'); }
                else b.classList.add('hidden');
            }
        }

        // === Window Functions ===
        function setFriendFeedback(text, type, autoClearMs) {
            if (friendBannerDismissTimer) {
                clearTimeout(friendBannerDismissTimer);
                friendBannerDismissTimer = null;
            }
            if (text == null || text === '') {
                friendActionBanner = null;
            } else {
                friendActionBanner = { text: text, type: type || 'info' };
                if (autoClearMs) {
                    friendBannerDismissTimer = setTimeout(function() {
                        friendBannerDismissTimer = null;
                        friendActionBanner = null;
                        if (activeTab === 'contacts') renderChatList();
                    }, autoClearMs);
                }
            }
            if (activeTab === 'contacts') renderChatList();
        }
        window.clearFriendFeedback = function() {
            setFriendFeedback(null);
        };

        window.setTab = function(t) {
            appScreen = 'main';
            activeTab = t;
            if (t === 'contacts') {
                sendWs({ type: 'GetFriendRequests' });
                sendWs({ type: 'GetContactsOnline' });
            }
            renderMain();
        };
        window.handleSearch = function(q) { searchQuery=q; renderChatList(); };
        window.handleFriendSearch = function(q) {
            friendSearchQuery = q;
            clearTimeout(friendSearchTimeout);
            if (q.trim().length < 2) {
                friendSearchResults = [];
                friendSearchLoading = false;
                renderChatList();
                return;
            }
            friendSearchLoading = true;
            renderChatList();
            friendSearchTimeout = setTimeout(function() {
                sendWs({ type: 'SearchUsers', query: q.trim() });
            }, 300);
        };
        window.openAddContactFlow = function() {
            appScreen = 'main';
            activeTab = 'contacts';
            sendWs({ type: 'GetFriendRequests' });
            sendWs({ type: 'GetContactsOnline' });
            renderMain();
            setTimeout(function() {
                var el = document.getElementById('friend-search-input');
                if (el) { el.focus(); el.select(); }
            }, 0);
        };
        window.sendFriendRequestFromResults = function(messengerId) {
            if (!messengerId || friendRequestSendingMid) return;
            friendRequestSendingMid = messengerId;
            setFriendFeedback('Отправляем запрос в друзья…', 'info');
            if (activeTab === 'contacts') renderChatList();
            sendWs({ type: 'SendFriendRequest', receiver_messenger_id: messengerId });
        };
        window.cancelOutgoingFriend = function(requestId) {
            if (!requestId) return;
            sendWs({ type: 'CancelFriendRequest', request_id: String(requestId) });
        };
        
        window.selectChat = function(id) {
            appScreen = 'main';
            activeConversation = conversations.find(c=>c.id===id);
            if(!activeConversation) return;
            activeConversation.unread_count = 0;
            typingUsers.clear();
            typingSent = false;
            clearTimeout(typingDebounceTimer);
            updateTypingIndicator();
            messages = [];
            hasMoreMessages = false;
            renderMain();
            sendWs({type:'GetMessages',conversation_id:id,limit:50});
            sendWs({type:'MarkAsRead',conversation_id:id,message_ids:[]});
        };
        
        window.handleContactClick = function(uid, createChat) {
            const ex = conversations.find(c=>!c.is_group&&c.other_user?.id===uid);
            if(ex) selectChat(ex.id);
            else if(createChat) {
                sendWs({type:'CreateConversation',user_ids:[uid],is_group:false});
                window.pendingContactId = uid;
            }
        };
        
        window.handleSendError = function() {
            const i = messages.findIndex(m => m.pending && m.conversation_id === activeConversation?.id);
            if (i >= 0) messages.splice(i, 1);
            showNotification('Не удалось отправить сообщение', 'error');
            renderMessages();
        };

        window.toggleReactionFromEl = function(el) {
            const mid = el.getAttribute('data-mid');
            const emoji = el.getAttribute('data-emoji');
            if (!mid || !emoji) return;
            if (!activeConversation || !wsConnected) return;
            const cid = String(activeConversation.id);
            const uid = String(profile?.user_id || '');
            if (!messageReactions[cid]) messageReactions[cid] = {};
            if (!messageReactions[cid][mid]) messageReactions[cid][mid] = [];
            const arr = messageReactions[cid][mid];
            const mine = arr.some(x => x.emoji === emoji && String(x.user_id) === uid);
            if (mine) {
                const ix = arr.findIndex(x => x.emoji === emoji && String(x.user_id) === uid);
                if (ix >= 0) arr.splice(ix, 1);
            } else {
                arr.push({ emoji: emoji, user_id: profile?.user_id });
            }
            renderMessages();
            if (mine) sendWs({ type: 'RemoveReaction', message_id: mid, emoji: emoji });
            else sendWs({ type: 'AddReaction', message_id: mid, emoji: emoji });
        };

        window.sendMsg = function() {
            const inp = document.querySelector('.message-input-box');
            const txt = inp.textContent.trim();
            if(!txt && !pendingFile) return;
            if (activeConversation) {
                sendWs({ type: 'TypingStop', conversation_id: activeConversation.id });
                typingSent = false;
                clearTimeout(typingDebounceTimer);
            }
            
            if (pendingFile) {
                const pf = pendingFile;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    const base64 = dataUrl.split(',')[1];
                    const pendingId = 'pending-' + Date.now();
                    const isImg = pf.type.startsWith('image/');
                    messages.push({
                        id: pendingId,
                        pending: true,
                        conversation_id: activeConversation.id,
                        sender_id: profile?.user_id,
                        content: txt || pf.name,
                        created_at: new Date().toISOString(),
                        message_type: isImg ? 'image' : 'file',
                        media_url: isImg ? dataUrl : null,
                        sender_username: profile?.display_name || profile?.messenger_id,
                        is_read: false
                    });
                    clearPendingFile();
                    sendWs({
                        type:'SendMessage',
                        conversation_id:activeConversation.id,
                        content: txt || pf.name,
                        message_type: isImg ? 'image' : 'file',
                        file_data: {
                            file_name: pf.name,
                            file_size: pf.size,
                            mime_type: pf.type,
                            file_type: isImg ? 'image' : 'document',
                            data_base64: base64
                        }
                    });
                };
                reader.readAsDataURL(pf);
            } else {
                const pendingId = 'pending-' + Date.now();
                messages.push({
                    id: pendingId,
                    pending: true,
                    conversation_id: activeConversation.id,
                    sender_id: profile?.user_id,
                    content: txt,
                    created_at: new Date().toISOString(),
                    message_type: 'text',
                    sender_username: profile?.display_name || profile?.messenger_id,
                    is_read: false
                });
                renderMessages();
                console.log('Sending message:', {conversation_id: activeConversation.id, content: txt});
                sendWs({type:'SendMessage',conversation_id:activeConversation.id,content:txt,reply_to_id:null});
            }
            
            inp.textContent = '';
            const btn = document.getElementById('send-btn');
            if (btn) btn.disabled = true;
        };
        
        window.handleInput = function(el) {
            const btn = document.getElementById('send-btn');
            if (btn) btn.disabled = !el.textContent.trim();
            if (!activeConversation || !wsConnected) return;
            if (!typingSent) {
                sendWs({ type: 'TypingStart', conversation_id: activeConversation.id });
                typingSent = true;
            }
            clearTimeout(typingDebounceTimer);
            typingDebounceTimer = setTimeout(() => {
                sendWs({ type: 'TypingStop', conversation_id: activeConversation.id });
                typingSent = false;
            }, 2000);
        };
        window.handleKey = function(e,el) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} };
        
        window.toggleEmojiPicker = function() {
            showEmojiPicker = !showEmojiPicker;
            renderActiveView();
        };
        
        window.insertEmoji = function(emoji) {
            const inp = document.querySelector('.message-input-box');
            inp.textContent += emoji;
            document.getElementById('send-btn').disabled = false;
            showEmojiPicker = false;
            renderActiveView();
        };
        
        window.attachFileClick = function() {
            document.getElementById('file-upload-input').click();
        };
        
        window.handleFileSelect = function(e) {
            const file = e.target.files[0];
            if(file) {
                pendingFile = file;
                renderActiveView();
            }
        };
        
        window.clearPendingFile = function() {
            pendingFile = null;
            renderActiveView();
        };
        
        window.uploadAvatarClick = function() {
            document.getElementById('avatar-upload-input').click();
        };
        
        window.handleAvatarUpload = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            e.target.value = '';

            const reader = new FileReader();
            reader.onload = function(ev) {
                const dataUrl = ev.target.result;
                profile = Object.assign({}, profile || {}, { avatar_url: dataUrl });
                renderActiveView();
                sendWs({ type: 'UpdateProfile', avatar_url: dataUrl });
            };
            reader.readAsDataURL(file);
        };

        // Настройки чата (личное имя контакта, название группы)
        window.openChatSettings = function() {
            if(!activeConversation) return;

            const ou = activeConversation.other_user;
            const customVal = (!activeConversation.is_group && ou)
                ? (ou.custom_name != null ? String(ou.custom_name) : '')
                : '';

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'chat-settings-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="modal-title">Настройки чата</h3>

                    <div style="margin-bottom:20px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">Название чата</label>
                        <input type="text" id="chat-name-input" class="form-input" value="${escapeHtml(activeConversation.is_group ? (activeConversation.name || '') : '')}" ${activeConversation.is_group ? '' : 'disabled'}>
                        ${!activeConversation.is_group ? '<div style="font-size:12px;color:var(--tg-hint);margin-top:4px">Для личных чатов общее название не задаётся</div>' : ''}
                    </div>

                    ${!activeConversation.is_group && ou ? `
                    <div style="margin-bottom:20px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">Имя контакта у вас</label>
                        <input type="text" id="custom-name-input" class="form-input" placeholder="Как показывать этого человека в списке и чате" value="${escapeHtml(customVal)}">
                        <div style="font-size:12px;color:var(--zg-muted);margin-top:6px">Видно только вам. Пустое поле — снова имя из профиля контакта.</div>
                    </div>
                    ` : ''}

                    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px">
                        <button type="button" onclick="closeChatSettings()" class="auth-button" style="background:var(--tg-tertiary-bg);padding:14px 24px">Закрыть</button>
                        ${activeConversation.is_group ? '<button type="button" onclick="saveChatName()" class="auth-button" style="padding:14px 24px">Сохранить название</button>' : ''}
                        ${!activeConversation.is_group && ou ? '<button type="button" onclick="saveContactDisplayName()" class="auth-button" style="padding:14px 24px">Сохранить имя контакта</button>' : ''}
                    </div>
                </div>`;
            document.body.appendChild(modal);
        };

        window.closeChatSettings = function() {
            const modal = document.getElementById('chat-settings-modal');
            if(modal) modal.remove();
        };

        window.saveContactDisplayName = function() {
            if (!activeConversation || activeConversation.is_group || !activeConversation.other_user) {
                closeChatSettings();
                return;
            }
            const inp = document.getElementById('custom-name-input');
            const v = inp ? inp.value.trim() : '';
            const ou = activeConversation.other_user;
            const uid = String(ou.id);
            ou.custom_name = v || null;
            conversations.forEach(function(c) {
                if (c.id === activeConversation.id && c.other_user && String(c.other_user.id) === uid) {
                    c.other_user.custom_name = ou.custom_name;
                }
            });
            contacts.forEach(function(c) {
                if (String(c.contact_user_id) === uid) {
                    c.custom_name = v || null;
                }
            });
            closeChatSettings();
            renderChatList();
            updateActiveChatHeaderFromState();
            renderMessages();
            sendWs({ type: 'SetCustomContactName', contact_user_id: uid, custom_name: v || null });
            showNotification('Имя сохранено', 'success');
        };

        window.saveChatName = function() {
            const newName = document.getElementById('chat-name-input').value.trim();
            if(!newName) return;
            activeConversation.name = newName;
            const conv = conversations.find(x => x.id === activeConversation.id);
            if (conv) conv.name = newName;
            closeChatSettings();
            renderChatList();
            updateActiveChatHeaderFromState();
            sendWs({ type: 'UpdateConversation', conversation_id: activeConversation.id, name: newName });
            showNotification('Название сохранено', 'success');
        };

        window.saveProfileSettings = function() {
            const displayNameEl = document.getElementById('settings-display-name');
            const customIdEl = document.getElementById('settings-custom-id');
            const aboutEl = document.getElementById('settings-about');
            const displayName = displayNameEl ? displayNameEl.value.trim() : '';
            const customUserId = customIdEl ? customIdEl.value.trim() : '';
            const about = aboutEl ? aboutEl.value.trim() : '';

            if(!displayName) {
                showNotification('Введите отображаемое имя', 'error');
                return;
            }

            profile = Object.assign({}, profile || {}, {
                display_name: displayName,
                custom_user_id: customUserId || null,
                about: about || null
            });
            renderSettingsPage();
            sendWs({
                type: 'UpdateProfileSettings',
                display_name: displayName,
                custom_user_id: customUserId || null,
                about: about || null
            });
            showNotification('Изменения применены', 'success');
        };

        window.respondReq = function(id, accept) {
            sendWs({type:'RespondToFriendRequest',request_id:id,accept});
            loadConversations();
        };

        window.showNotification = function(message, type='info') {
            // Send notification to parent window (ZeroBrowser)
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'zeroday:notification',
                    payload: { message, notificationType: type }
                }, '*');
            }
            
            const notif = document.createElement('div');
            const bg = type === 'success' ? 'var(--gradient-success)' : type === 'error' ? 'linear-gradient(135deg,#e53935,#c62828)' : 'var(--gradient-primary)';
            notif.style.cssText = `position:fixed;top:20px;right:20px;padding:16px 24px;background:${bg};border-radius:12px;color:white;font-weight:600;box-shadow:var(--shadow-lg);z-index:10000;animation:slideUp 0.3s ease-out`;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        };
        
        // Функция для отправки событий в родительское окно
        window.sendToParent = function(eventType, data) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'zeroday:' + eventType,
                    payload: data
                }, '*');
            }
        };

        (function initMessengerChrome() {
            const menu = document.getElementById('zg-ctx-menu');
            document.addEventListener('contextmenu', function(e) {
                const root = document.getElementById('app');
                if (!root || !root.contains(e.target)) return;
                e.preventDefault();
                if (!menu) return;
                const row = e.target.closest('.message.own[data-message-id]');
                if (row && !row.classList.contains('message-pending')) {
                    const mid = row.getAttribute('data-message-id');
                    if (mid && String(mid).indexOf('pending-') !== 0) {
                        ctxMenuMessageId = mid;
                        menu.classList.add('visible');
                        menu.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
                        menu.style.top = Math.min(e.clientY, window.innerHeight - 88) + 'px';
                        menu.setAttribute('aria-hidden', 'false');
                        return;
                    }
                }
                menu.classList.remove('visible');
                menu.setAttribute('aria-hidden', 'true');
                ctxMenuMessageId = null;
            }, true);
            document.addEventListener('click', function(e) {
                if (!menu || !menu.classList.contains('visible')) return;
                if (!menu.contains(e.target)) {
                    menu.classList.remove('visible');
                    menu.setAttribute('aria-hidden', 'true');
                    ctxMenuMessageId = null;
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && menu && menu.classList.contains('visible')) {
                    menu.classList.remove('visible');
                    menu.setAttribute('aria-hidden', 'true');
                    ctxMenuMessageId = null;
                }
            });
            document.getElementById('zg-ctx-edit')?.addEventListener('click', function(ev) {
                ev.stopPropagation();
                const mid = ctxMenuMessageId;
                if (menu) {
                    menu.classList.remove('visible');
                    menu.setAttribute('aria-hidden', 'true');
                }
                ctxMenuMessageId = null;
                if (mid) beginEditMessage(mid);
            });
            document.getElementById('zg-ctx-delete')?.addEventListener('click', function(ev) {
                ev.stopPropagation();
                const mid = ctxMenuMessageId;
                if (menu) {
                    menu.classList.remove('visible');
                    menu.setAttribute('aria-hidden', 'true');
                }
                ctxMenuMessageId = null;
                if (mid && confirm('Удалить это сообщение?')) {
                    const midStr = String(mid);
                    const ix = messages.findIndex(m => String(m.id) === midStr);
                    if (ix >= 0) messages.splice(ix, 1);
                    if (activeConversation) {
                        const cid = String(activeConversation.id);
                        if (messageReactions[cid] && messageReactions[cid][midStr]) {
                            delete messageReactions[cid][midStr];
                        }
                    }
                    renderMessages();
                    sendWs({ type: 'DeleteMessage', message_id: midStr });
                }
            });
        })();

        // Инициализация
        if(token) {
            connectWebSocket();
        } else {
            renderAuth();
        }
    </script>
</body>
</html>
