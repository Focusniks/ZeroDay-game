<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerogram</title>
    <style>
        :root {
            /* Основная палитра - современный градиент */
            --tg-bg: #0f1419;
            --tg-secondary-bg: #1a1f2e;
            --tg-tertiary-bg: #242b3d;
            --tg-text: #e8eaed;
            --tg-hint: #8b9bb4;
            --tg-link: #64b5f6;
            --tg-button: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --tg-button-text: #ffffff;
            --tg-message-in: #1e2538;
            --tg-message-out: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --tg-border: #2a3142;
            --tg-hover: #2a3142;
            --tg-active: #353d52;
            --tg-online: #4caf50;
            --tg-offline: #607d8b;
            
            /* Градиенты для акцентов */
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-success: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --gradient-warning: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            
            /* Тени */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-bg);
            color: var(--tg-text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }

        .tg-selectable {
            user-select: text;
            -webkit-user-select: text;
            cursor: text;
        }

        .tg-cursor-pointer { cursor: pointer; }

        /* Auth Screen с анимацией */
        .auth-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0f1419 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-card {
            background: var(--tg-secondary-bg);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--tg-border);
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            box-shadow: var(--shadow-glow);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: var(--shadow-glow); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(102, 126, 234, 0.5); }
        }

        .auth-logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-logo p { color: var(--tg-hint); margin-top: 10px; font-size: 14px; }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--tg-hint);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            background: var(--tg-tertiary-bg);
            border: 2px solid var(--tg-border);
            border-radius: 16px;
            color: var(--tg-text);
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-input::placeholder { color: var(--tg-hint); }

        .auth-button {
            width: 100%;
            padding: 18px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow-md);
        }

        .auth-button:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .auth-button:active { transform: translateY(-1px); }
        .auth-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .auth-error {
            background: rgba(239, 83, 80, 0.1);
            border: 2px solid rgba(239, 83, 80, 0.3);
            border-radius: 16px;
            padding: 16px;
            color: #ef5350;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .auth-error.visible { display: block; }

        /* Main Messenger */
        .messenger-container {
            display: flex;
            height: 100vh;
            max-width: 1800px;
            margin: 0 auto;
            background: linear-gradient(180deg, var(--tg-bg) 0%, var(--tg-secondary-bg) 100%);
        }

        .sidebar {
            width: 450px;
            background: var(--tg-secondary-bg);
            border-right: 1px solid var(--tg-border);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
        }

        .sidebar-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--tg-tertiary-bg);
            border-bottom: 1px solid var(--tg-border);
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--tg-tertiary-bg);
            border: 2px solid var(--tg-border);
            color: var(--tg-hint);
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .icon-btn:hover {
            background: var(--tg-hover);
            color: var(--tg-text);
            border-color: var(--tg-link);
            transform: scale(1.05);
        }

        .search-box { flex: 1; position: relative; }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 48px;
            background: var(--tg-tertiary-bg);
            border: 2px solid var(--tg-border);
            border-radius: 24px;
            color: var(--tg-text);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--tg-link);
            box-shadow: 0 0 0 4px rgba(100, 181, 246, 0.1);
        }

        .search-input::placeholder { color: var(--tg-hint); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--tg-hint); font-size: 18px; }

        .tabs {
            display: flex;
            padding: 0 24px;
            border-bottom: 1px solid var(--tg-border);
            background: var(--tg-tertiary-bg);
        }

        .tab {
            flex: 1;
            padding: 16px;
            background: transparent;
            border: none;
            color: var(--tg-hint);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            position: relative;
        }

        .tab:hover { color: var(--tg-text); }
        .tab.active {
            color: var(--tg-link);
            border-bottom-color: var(--tg-link);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--gradient-primary);
            border-radius: 2px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-list::-webkit-scrollbar { width: 6px; }
        .chat-list::-webkit-scrollbar-track { background: transparent; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--tg-border); border-radius: 3px; }
        .chat-list::-webkit-scrollbar-thumb:hover { background: var(--tg-hint); }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 6px;
            position: relative;
            overflow: hidden;
        }

        .chat-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .chat-item:hover { background: var(--tg-hover); }
        .chat-item:hover::before { opacity: 0.05; }
        .chat-item.active {
            background: var(--tg-active);
            box-shadow: var(--shadow-sm);
        }

        .chat-item.active::before { opacity: 0.1; }

        .chat-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s;
        }

        .chat-item:hover .chat-avatar { transform: scale(1.05); }

        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background: var(--gradient-success);
            border: 3px solid var(--tg-secondary-bg);
            border-radius: 50%;
            animation: onlinePulse 2s ease-in-out infinite;
        }

        @keyframes onlinePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(76, 175, 80, 0); }
        }

        .chat-avatar.offline::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 12px;
            height: 12px;
            background: var(--tg-offline);
            border: 2px solid var(--tg-secondary-bg);
            border-radius: 50%;
        }

        .chat-info { flex: 1; min-width: 0; z-index: 1; }

        .chat-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .chat-name {
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--tg-text);
        }

        .chat-time {
            font-size: 12px;
            color: var(--tg-hint);
            margin-left: 8px;
            font-weight: 500;
        }

        .chat-preview {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-preview-text {
            color: var(--tg-hint);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-preview-text.own { color: var(--tg-link); }

        .unread-badge {
            background: var(--gradient-warning);
            color: white;
            font-size: 12px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 14px;
            min-width: 22px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--tg-bg);
        }

        .chat-header {
            padding: 20px 28px;
            background: var(--tg-secondary-bg);
            border-bottom: 1px solid var(--tg-border);
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: var(--shadow-sm);
        }

        .chat-header-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: var(--shadow-md);
        }

        .chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .chat-header-info { flex: 1; }
        .chat-header-name { font-weight: 700; font-size: 17px; margin-bottom: 4px; color: var(--tg-text); }
        .chat-header-status { font-size: 13px; color: var(--tg-hint); font-weight: 500; }
        .chat-header-status.online { color: var(--tg-online); }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: radial-gradient(ellipse at top, rgba(102, 126, 234, 0.05) 0%, transparent 50%);
        }

        .messages-container::-webkit-scrollbar { width: 8px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: var(--tg-border); border-radius: 4px; }

        .message {
            display: flex;
            gap: 12px;
            max-width: 65%;
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.own { margin-left: auto; flex-direction: row-reverse; }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .message-bubble {
            background: var(--tg-message-in);
            border-radius: 20px;
            padding: 12px 16px;
            max-width: 100%;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .message.own .message-bubble {
            background: var(--tg-message-out);
            border-bottom-right-radius: 6px;
        }

        .message:not(.own) .message-bubble { border-bottom-left-radius: 6px; }

        .message-sender {
            font-size: 13px;
            font-weight: 700;
            color: var(--tg-link);
            margin-bottom: 6px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            color: var(--tg-text);
        }

        .message-image {
            max-width: 300px;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message-image:hover { transform: scale(1.02); }

        .message-file {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 12px;
            margin: 8px 0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .message-file:hover { background: rgba(0,0,0,0.3); }

        .message-file-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .message-file-info { flex: 1; }
        .message-file-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
        .message-file-size { font-size: 11px; color: var(--tg-hint); }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 8px;
        }

        .message-time { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 500; }
        .message-read { font-size: 11px; color: #64b5f6; font-weight: 700; }

        .typing-indicator {
            padding: 10px 28px;
            font-size: 13px;
            color: var(--tg-hint);
            font-style: italic;
            background: var(--tg-secondary-bg);
            animation: typingFade 1.5s ease-in-out infinite;
        }

        @keyframes typingFade {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .message-input-container {
            padding: 20px 28px;
            background: var(--tg-secondary-bg);
            border-top: 1px solid var(--tg-border);
            box-shadow: var(--shadow-md);
        }

        .message-input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            max-width: 900px;
            margin: 0 auto;
        }

        .input-actions { display: flex; gap: 6px; }

        .input-action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--tg-tertiary-bg);
            border: 2px solid var(--tg-border);
            color: var(--tg-hint);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .input-action-btn:hover {
            background: var(--tg-hover);
            color: var(--tg-text);
            border-color: var(--tg-link);
            transform: scale(1.1);
        }

        .message-input-box {
            flex: 1;
            background: var(--tg-tertiary-bg);
            border: 2px solid var(--tg-border);
            border-radius: 24px;
            padding: 14px 20px;
            min-height: 50px;
            max-height: 200px;
            overflow-y: auto;
            outline: none;
            font-size: 14px;
            color: var(--tg-text);
            transition: all 0.3s;
        }

        .message-input-box:focus {
            border-color: var(--tg-link);
            box-shadow: 0 0 0 4px rgba(100, 181, 246, 0.1);
        }

        .message-input-box:empty:before {
            content: attr(placeholder);
            color: var(--tg-hint);
        }

        .send-button {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--gradient-primary);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: var(--shadow-md);
        }

        .send-button:hover {
            transform: scale(1.1) rotate(-10deg);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .send-button:active { transform: scale(1.05) rotate(-5deg); }
        .send-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .empty-chat-icon {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            opacity: 0.3;
            box-shadow: var(--shadow-lg);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .empty-chat-text { color: var(--tg-hint); font-size: 18px; font-weight: 500; }

        .hidden { display: none !important; }

        /* Modal styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: var(--tg-secondary-bg);
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--tg-border);
            animation: slideUp 0.4s ease-out;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Emoji picker */
        .emoji-picker {
            position: absolute;
            bottom: 70px;
            left: 20px;
            background: var(--tg-secondary-bg);
            border: 1px solid var(--tg-border);
            border-radius: 16px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 100;
            animation: slideUp 0.2s ease-out;
        }

        .emoji-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 20px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .emoji-btn:hover {
            background: var(--tg-hover);
            transform: scale(1.2);
        }

        /* File preview */
        .file-preview {
            background: var(--tg-tertiary-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s ease-out;
        }

        .file-preview-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .file-preview-info { flex: 1; }
        .file-preview-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .file-preview-size { font-size: 12px; color: var(--tg-hint); }
        .file-preview-remove {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(239, 83, 80, 0.2);
            border: none;
            color: #ef5350;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .file-preview-remove:hover { background: rgba(239, 83, 80, 0.4); }

        /* Last seen tooltip */
        .last-seen {
            font-size: 12px;
            color: var(--tg-hint);
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // Конфигурация
        window.ENV = {
            WS_HOST: '127.0.0.1',
            WS_PORT: '8080',
            WS_URL: 'ws://127.0.0.1:8080/ws',
            HTTP_HOST: '127.0.0.1',
            HTTP_PORT: '8000',
            HTTP_URL: 'http://127.0.0.1:8000/api'
        };

        const WS_URL = window.ENV.WS_URL;
        const HTTP_URL = window.ENV.HTTP_URL;

        let token = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('zeroday.token');
        let ws = null;
        let profile = null;
        let conversations = [];
        let activeConversation = null;
        let messages = [];
        let activeTab = 'chats';
        let searchQuery = '';
        let friendRequests = [];
        let contacts = [];
        let typingUsers = new Set();
        let filteredConversations = [];
        let pendingFile = null;
        let showEmojiPicker = false;

        // === Helper Functions ===
        function getConversationTitle(c) {
            if (!c) return 'Чат';
            if (c.is_group) return c.name || 'Групповой чат';
            return c.other_user?.username || 'Контакт';
        }

        function getAvatarInitials(name) {
            return name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
        }

        function getConversationAvatarUrl(c) {
            if (!c) return null;
            return c.is_group ? (c.avatar_url || null) : (c.other_user?.avatar_url || null);
        }

        function getSelfAvatarUrl() {
            return profile?.avatar_url || null;
        }

        function normalizeConversations(input) {
            const map = new Map();
            (input || []).forEach(c => {
                const key = c.is_group ? `group:${c.id}` : `dm:${c.other_user?.id || c.id}`;
                const existing = map.get(key);
                if (!existing) { map.set(key, c); return; }
                const existingTs = new Date(existing.updated_at || 0).getTime();
                const nextTs = new Date(c.updated_at || 0).getTime();
                if (nextTs >= existingTs) {
                    map.set(key, { ...existing, ...c, unread_count: Math.max(existing.unread_count || 0, c.unread_count || 0) });
                }
            });
            return Array.from(map.values()).sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now.getTime() - date.getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days === 0) return date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            if (days === 1) return 'Вчера';
            if (days < 7) return date.toLocaleDateString('ru-RU',{weekday:'long'});
            return date.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
        }

        function formatLastSeen(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diff = now.getTime() - date.getTime();
            const minutes = Math.floor(diff / (1000 * 60));
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (minutes < 1) return 'был(а) только что';
            if (minutes < 60) return `был(а) ${minutes} мин. назад`;
            if (hours < 24) return `был(а) ${hours} ч. назад`;
            if (days === 1) return 'был(а) вчера';
            if (days < 7) return `был(а) ${days} дн. назад`;
            return `был(а) ${date.toLocaleDateString('ru-RU')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // === WebSocket ===
        function connectWebSocket() {
            if(!token) return;
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                console.log('✓ Connected');
                ws.send(JSON.stringify({type:'Authorize',token}));
                // Heartbeat каждые 5 секунд
                setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({type:'UpdateActivity'}));
                    }
                }, 5000);
            };
            ws.onclose = () => console.log('✗ Disconnected');
            ws.onerror = e => console.error('WS Error:',e);
            ws.onmessage = e => {
                try {
                    const data = JSON.parse(e.data);
                    handleWsMessage(data);
                } catch(err) { console.error('Parse error:',err); }
            };
        }

        function sendWs(msg) {
            if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(msg));
        }

        function handleWsMessage(data) {
            console.log('WS:',data.type,data);
            switch(data.type) {
                case 'AuthSuccess':
                    localStorage.setItem('zeroday.token',data.token);
                    token = data.token;
                    sendWs({type:'GetProfile'});
                    break;
                case 'Profile':
                    profile = data.profile;
                    if(data.profile.is_setup_complete) {
                        renderMain();
                        loadConversations();
                    } else renderSetup();
                    break;
                case 'ConversationsList':
                    conversations = normalizeConversations(data.conversations || []);
                    renderChatList();
                    // Если есть активный чат, проверяем что он всё ещё в списке
                    if(activeConversation) {
                        const stillExists = conversations.find(c => c.id === activeConversation.id);
                        if(stillExists) {
                            // Обновляем активный чат из списка
                            activeConversation = stillExists;
                            // Загружаем сообщения только если их ещё нет
                            if(messages.length === 0) {
                                sendWs({type:'GetMessages',conversation_id:activeConversation.id,limit:50});
                            }
                        } else {
                            // Чат исчез из списка - закрываем
                            activeConversation = null;
                            messages = [];
                        }
                    }
                    renderMain();
                    break;
                case 'ConversationCreated':
                    if(window.handleConversationCreated) {
                        window.handleConversationCreated(data.conversation);
                    }
                    break;
                case 'MessagesList':
                    console.log('MessagesList received:', data.messages?.length, 'messages for conversation', activeConversation?.id);
                    messages = (data.messages||[]).reverse();
                    console.log('Messages after reverse:', messages.length);
                    renderMessages();
                    console.log('renderMessages called, messages element exists:', !!document.getElementById('messages'));
                    break;
                case 'MessageSent':
                case 'MessageReceived':
                    handleMessageUpdate(data.message);
                    break;
                case 'FriendRequestsList':
                    friendRequests = data.requests||[];
                    updateBadge();
                    if(activeTab==='contacts') renderContacts();
                    break;
                case 'ContactsList':
                    contacts = data.contacts||[];
                    if(activeTab==='contacts') renderContacts();
                    break;
                case 'ContactsOnlineList':
                    contacts = data.contacts||[];
                    if(activeTab==='contacts') renderContacts();
                    break;
                case 'ProfilesList':
                    if(window.handleSearchResults) {
                        window.handleSearchResults(data.profiles);
                    }
                    break;
                case 'Error':
                    if(data.code === 'request_error' || data.message?.includes('друз')) {
                        if(window.handleFriendRequestError) {
                            window.handleFriendRequestError(data.message);
                        }
                    }
                    else if(data.code === 'not_found' || data.message?.includes('не найден')) {
                        renderSetup();
                    }
                    else {
                        console.error('Messenger Error:', data);
                    }
                    break;
            }
        }

        function handleMessageUpdate(msg) {
            // Обновляем список чатов
            const idx = conversations.findIndex(c=>c.id===msg.conversation_id);
            if(idx!==-1) {
                conversations[idx].last_message = msg;
                conversations[idx].updated_at = msg.created_at;
            } else {
                // Чат не найден - добавляем новый
                conversations.unshift({
                    id: msg.conversation_id,
                    last_message: msg,
                    updated_at: msg.created_at,
                    unread_count: msg.sender_id !== profile?.user_id ? 1 : 0,
                    is_group: false,
                    other_user: msg.sender_id !== profile?.user_id ? { 
                        id: msg.sender_id, 
                        username: msg.sender_username,
                        is_online: false 
                    } : null
                });
            }
            
            // Сортируем по времени
            conversations.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
            renderChatList();
            
            // Если это сообщение активного чата - добавляем в сообщения
            if(activeConversation && msg.conversation_id===activeConversation.id) {
                if(!messages.find(m=>m.id===msg.id)) {
                    messages.push(msg);
                    renderMessages();
                }
                // Обновляем активный чат
                activeConversation = conversations.find(c => c.id === msg.conversation_id);
            }
        }

        function loadConversations() {
            sendWs({type:'GetConversations'});
            sendWs({type:'GetFriendRequests'});
            sendWs({type:'GetContactsOnline'});
        }

        // === Render Functions ===
        function renderAuth() {
            document.getElementById('app').innerHTML = `
                <div class="auth-screen">
                    <div class="auth-card">
                        <div class="auth-logo">
                            <div class="auth-logo-icon">✈️</div>
                            <h1>Zerogram</h1>
                            <p>Быстрый и безопасный мессенджер</p>
                        </div>
                        <div class="auth-error" id="auth-error"></div>
                        <div class="form-group">
                            <label>Токен</label>
                            <input type="text" class="form-input" id="auth-token" placeholder="Введите токен" value="${token||''}">
                        </div>
                        <button class="auth-button" onclick="doAuth()">Войти</button>
                    </div>
                </div>`;
        }

        window.doAuth = function() {
            const t = document.getElementById('auth-token').value.trim();
            if(!t) { document.getElementById('auth-error').classList.add('visible'); return; }
            token = t;
            localStorage.setItem('zeroday.token',t);
            connectWebSocket();
        };

        function renderSetup() {
            document.getElementById('app').innerHTML = `
                <div class="auth-screen">
                    <div class="auth-card">
                        <div class="auth-logo">
                            <div class="auth-logo-icon">🚀</div>
                            <h1>Создание профиля</h1>
                            <p>Настройте Zerogram</p>
                        </div>
                        <form onsubmit="doSetup(event)">
                            <div class="form-group">
                                <label>Уникальное имя</label>
                                <input type="text" name="messenger_id" class="form-input" placeholder="@username" required pattern="[a-z0-9_]+" minlength="3">
                            </div>
                            <div class="form-group">
                                <label>Отображаемое имя</label>
                                <input type="text" name="display_name" class="form-input" placeholder="Как вас называть" required>
                            </div>
                            <div class="form-group">
                                <label>О себе</label>
                                <textarea name="about" class="form-input" placeholder="Расскажите о себе" rows="3"></textarea>
                            </div>
                            <button type="submit" class="auth-button">Создать</button>
                        </form>
                    </div>
                </div>`;
        }

        window.doSetup = function(e) {
            e.preventDefault();
            const f = e.target;
            sendWs({
                type:'SetupProfile',
                messenger_id:f.messenger_id.value.trim().toLowerCase(),
                display_name:f.display_name.value.trim(),
                about:f.about.value.trim()||undefined
            });
        };

        function renderMain() {
            const avatarHtml = getSelfAvatarUrl() 
                ? `<img src="${escapeHtml(getSelfAvatarUrl())}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
                : '👤';
            
            document.getElementById('app').innerHTML = `
                <div class="messenger-container">
                    <div class="sidebar">
                        <div class="sidebar-header">
                            <button class="icon-btn" onclick="uploadAvatarClick()" title="Сменить аватар">${avatarHtml}</button>
                            <div class="search-box">
                                <span class="search-icon">🔍</span>
                                <input type="text" class="search-input" placeholder="Поиск" oninput="handleSearch(this.value)">
                            </div>
                            <button class="icon-btn" onclick="addFriend()" title="Добавить контакт">＋</button>
                            <input id="avatar-upload-input" type="file" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
                            <input id="file-upload-input" type="file" style="display:none" onchange="handleFileSelect(event)">
                        </div>
                        <div class="tabs">
                            <button class="tab ${activeTab==='chats'?'active':''}" onclick="setTab('chats')">Чаты</button>
                            <button class="tab ${activeTab==='contacts'?'active':''}" onclick="setTab('contacts')">Контакты <span id="badge" class="unread-badge hidden" style="display:inline;margin-left:6px;">0</span></button>
                        </div>
                        <div class="chat-list" id="chat-list"></div>
                    </div>
                    <div class="chat-area">
                        ${activeConversation?`
                            <div class="chat-header">
                                <div class="chat-header-avatar">${getConversationAvatarUrl(activeConversation) ? '<img src="'+escapeHtml(getConversationAvatarUrl(activeConversation))+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">' : getAvatarInitials(activeConversation)}</div>
                                <div class="chat-header-info">
                                    <div class="chat-header-name">${escapeHtml(getConversationTitle(activeConversation))}</div>
                                    <div class="chat-header-status ${activeConversation.other_user?.is_online?'online':''}">
                                        ${activeConversation.other_user?.is_online ? 'онлайн' : (activeConversation.other_user?.last_seen ? formatLastSeen(activeConversation.other_user.last_seen) : 'оффлайн')}
                                    </div>
                                </div>
                                <button class="icon-btn" onclick="openChatSettings()">⋮</button>
                            </div>
                            <div class="messages-container" id="messages"></div>
                            <div class="typing-indicator hidden" id="typing"></div>
                            <div class="message-input-container">
                                ${pendingFile ? `
                                    <div class="file-preview">
                                        <div class="file-preview-icon">📎</div>
                                        <div class="file-preview-info">
                                            <div class="file-preview-name">${escapeHtml(pendingFile.name)}</div>
                                            <div class="file-preview-size">${formatFileSize(pendingFile.size)}</div>
                                        </div>
                                        <button class="file-preview-remove" onclick="clearPendingFile()">✕</button>
                                    </div>
                                ` : ''}
                                <div class="message-input-wrapper">
                                    <div class="input-actions">
                                        <button class="input-action-btn" onclick="attachFileClick()" title="Прикрепить файл">📎</button>
                                        <button class="input-action-btn" onclick="toggleEmojiPicker()" title="Эмодзи">😊</button>
                                    </div>
                                    <div class="message-input-box tg-selectable" contenteditable placeholder="Написать сообщение..." oninput="handleInput(this)" onkeydown="handleKey(event,this)"></div>
                                    <button class="send-button" id="send-btn" onclick="sendMsg()" disabled>➤</button>
                                </div>
                                ${showEmojiPicker ? `
                                    <div class="emoji-picker">
                                        ${['😀','😂','😍','🥰','😎','🤔','😢','😡','👍','👎','❤️','🔥','🎉','👋','🙏','💪'].map(e => `<button class="emoji-btn" onclick="insertEmoji('${e}')">${e}</button>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `:`
                            <div class="empty-chat">
                                <div class="empty-chat-icon">💬</div>
                                <div class="empty-chat-text">Выберите чат чтобы начать общение</div>
                            </div>
                        `}
                    </div>
                </div>`;
            if(activeConversation) renderMessages();
            renderChatList();
            updateBadge();
        }

        function renderChatList() {
            const list = document.getElementById('chat-list');
            if(!list) return;
            
            if(activeTab==='chats') {
                filteredConversations = conversations.filter(c=>{
                    const n = getConversationTitle(c);
                    return n.toLowerCase().includes(searchQuery.toLowerCase());
                });
                
                if(filteredConversations.length===0) {
                    list.innerHTML = '<div style="padding:40px 20px;text-align:center;color:var(--tg-hint)">'+(searchQuery?'Ничего не найдено':'Нет чатов')+'</div>';
                    return;
                }
                
                list.innerHTML = filteredConversations.map(c=>{
                    const name = getConversationTitle(c);
                    const lm = c.last_message;
                    const active = activeConversation?.id===c.id;
                    const avatar = getConversationAvatarUrl(c);
                    const onlineClass = c.other_user?.is_online ? 'online' : (c.other_user ? 'offline' : '');
                    
                    return `<div class="chat-item ${active?'active':''}" onclick="selectChat('${c.id}')">
                        <div class="chat-avatar ${onlineClass}">${avatar?'<img src="'+escapeHtml(avatar)+'" alt="">':getInitials(name)}</div>
                        <div class="chat-info">
                            <div class="chat-name-row">
                                <span class="chat-name">${escapeHtml(name)}</span>
                                <span class="chat-time">${lm?formatTime(lm.created_at):''}</span>
                            </div>
                            <div class="chat-preview">
                                <span class="chat-preview-text ${lm?.sender_id===profile?.user_id?'own':''}">${lm?(lm.sender_id!==profile?.user_id?lm.sender_username+': ':'')+lm.content:'Нет сообщений'}</span>
                                ${c.unread_count>0?'<span class="unread-badge">'+c.unread_count+'</span>':''}
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } else {
                renderContacts();
            }
        }

        function renderContacts() {
            const list = document.getElementById('chat-list');
            if(!list) return;

            let html = '';

            if(friendRequests.length>0) {
                html += '<div style="padding:16px;"><h4 style="font-size:13px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:12px">Входящие ('+friendRequests.length+')</h4>';
                html += friendRequests.map(r=>`<div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--tg-hover);border-radius:12px;margin-bottom:8px">
                    <div class="chat-avatar" style="width:44px;height:44px;font-size:16px">${r.sender_avatar_url ? '<img src="'+escapeHtml(r.sender_avatar_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">' : getInitials(r.sender_display_name||'User')}</div>
                    <div style="flex:1"><div style="font-weight:600">${r.sender_display_name}</div><div style="font-size:13px;color:var(--tg-hint)">@${r.sender_messenger_id}</div></div>
                    <div style="display:flex;gap:8px">
                        <button onclick="respondReq('${r.id}',true)" style="padding:8px 16px;background:var(--gradient-success);border:none;border-radius:8px;color:white;cursor:pointer;font-weight:600">✓</button>
                        <button onclick="respondReq('${r.id}',false)" style="padding:8px 16px;background:#e53935;border:none;border-radius:8px;color:white;cursor:pointer;font-weight:600">✕</button>
                    </div>
                </div>`).join('');
                html += '</div>';
            }

            html += '<div style="padding:16px;"><h4 style="font-size:13px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:12px">Контакты ('+contacts.length+')</h4>';

            if(contacts.length===0) {
                html += '<div style="padding:20px;text-align:center;color:var(--tg-hint)">Нет контактов</div>';
            } else {
                html += contacts.map(c=>{
                    const onlineClass = c.is_online ? 'online' : 'offline';
                    const lastSeenText = c.is_online ? 'онлайн' : formatLastSeen(c.last_seen);
                    const avatarHtml = c.contact_avatar_url 
                        ? '<img src="'+escapeHtml(c.contact_avatar_url)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'
                        : getInitials(c.custom_name||c.contact_display_name||'User');
                    return `<div class="chat-item" onclick="handleContactClick('${c.contact_user_id}',true)">
                        <div class="chat-avatar ${onlineClass}">${avatarHtml}</div>
                        <div class="chat-info">
                            <div class="chat-name">${escapeHtml(c.custom_name||c.contact_display_name)}</div>
                            <div class="chat-preview-text">@${c.contact_messenger_id} • ${lastSeenText}</div>
                        </div>
                    </div>`;
                }).join('');
            }

            html += '</div>';
            list.innerHTML = html;
        }

        function renderMessages() {
            const c = document.getElementById('messages');
            if(!c) return;

            if(messages.length===0) {
                c.innerHTML = '<div class="empty-chat"><div class="empty-chat-icon" style="width:80px;height:80px;font-size:30px">💬</div><div class="empty-chat-text">Начните общение</div></div>';
                return;
            }

            c.innerHTML = messages.map(m=>{
                const own = m.sender_id===profile?.user_id;
                const showRead = own && m.is_read;
                
                // Получаем имя и аватарку отправителя
                let senderName = m.sender_username || 'User';
                let senderAvatar = null;
                
                // Если это не своё сообщение, ищем профиль отправителя в контактах или активном чате
                if (!own) {
                    // Проверяем other_user в активном чате (для личных чатов)
                    if (activeConversation?.other_user) {
                        if (activeConversation.other_user.id === m.sender_id) {
                            senderName = activeConversation.other_user.username || senderName;
                            senderAvatar = activeConversation.other_user.avatar_url;
                        }
                    }
                    // Или ищем в контактах
                    const contact = contacts.find(c => c.contact_user_id === m.sender_id);
                    if (contact) {
                        senderName = contact.custom_name || contact.contact_display_name || senderName;
                        senderAvatar = contact.contact_avatar_url;
                    }
                } else {
                    // Своё сообщение - используем свой профиль
                    senderName = profile?.display_name || profile?.messenger_id || 'Вы';
                    senderAvatar = profile?.avatar_url;
                }
                
                const avatarContent = senderAvatar 
                    ? '<img src="'+escapeHtml(senderAvatar)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'
                    : getInitials(senderName);

                // Проверка на изображение или файл
                const isImage = m.message_type === 'image' || (m.media_url && m.media_url.match(/\.(jpg|jpeg|png|gif|webp)$/i));
                const isFile = m.message_type === 'file' || (m.media_url && !isImage);

                let contentHtml = `<div class="message-text">${escapeHtml(m.content)}</div>`;

                if (isImage && m.media_url) {
                    contentHtml += `<img src="${escapeHtml(m.media_url)}" class="message-image" alt="Image" onclick="viewImage('${escapeHtml(m.media_url)}')">`;
                } else if (isFile && m.media_url) {
                    const fileName = m.media_url.split('/').pop() || 'file';
                    contentHtml += `
                        <div class="message-file" onclick="downloadFile('${escapeHtml(m.media_url)}')">
                            <div class="message-file-icon">📎</div>
                            <div class="message-file-info">
                                <div class="message-file-name">${escapeHtml(fileName)}</div>
                                <div class="message-file-size">Нажмите для загрузки</div>
                            </div>
                        </div>
                    `;
                }

                return `<div class="message ${own?'own':''}">
                    ${!own?'<div class="message-avatar">${avatarContent}</div>':''}
                    <div class="message-bubble">
                        ${!own?'<div class="message-sender">'+escapeHtml(senderName)+'</div>':''}
                        ${contentHtml}
                        <div class="message-meta"><span class="message-time">${formatTime(m.created_at)}</span>${showRead?'<span class="message-read">✓✓</span>':''}</div>
                    </div>
                </div>`;
            }).join('');

            c.scrollTop = c.scrollHeight;
        }

        function updateBadge() {
            const b = document.getElementById('badge');
            if(b) {
                if(friendRequests.length>0) { b.textContent=friendRequests.length; b.classList.remove('hidden'); }
                else b.classList.add('hidden');
            }
        }

        // === Window Functions ===
        window.setTab = function(t) { activeTab=t; renderMain(); };
        window.handleSearch = function(q) { searchQuery=q; renderChatList(); };
        
        window.selectChat = function(id) {
            activeConversation = conversations.find(c=>c.id===id);
            if(!activeConversation) return;
            
            // Очищаем сообщения перед загрузкой новых
            messages = [];
            
            // Сначала рендерим UI с пустыми сообщениями
            renderMain();
            
            // Затем загружаем сообщения
            sendWs({type:'GetMessages',conversation_id:id,limit:50});
            sendWs({type:'MarkAsRead',conversation_id:id,message_ids:[]});
        };
        
        window.handleContactClick = function(uid, createChat) {
            const ex = conversations.find(c=>!c.is_group&&c.other_user?.id===uid);
            if(ex) selectChat(ex.id);
            else if(createChat) {
                sendWs({type:'CreateConversation',user_ids:[uid],is_group:false});
                window.pendingContactId = uid;
            }
        };
        
        window.sendMsg = function() {
            const inp = document.querySelector('.message-input-box');
            const txt = inp.textContent.trim();
            if(!txt && !pendingFile) return;
            
            if (pendingFile) {
                // Отправка файла
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64 = e.target.result.split(',')[1];
                    sendWs({
                        type:'SendMessage',
                        conversation_id:activeConversation.id,
                        content: txt || pendingFile.name,
                        message_type: pendingFile.type.startsWith('image/') ? 'image' : 'file',
                        file_data: {
                            file_name: pendingFile.name,
                            file_size: pendingFile.size,
                            mime_type: pendingFile.type,
                            file_type: pendingFile.type.startsWith('image/') ? 'image' : 'document',
                            data_base64: base64
                        }
                    });
                    clearPendingFile();
                };
                reader.readAsDataURL(pendingFile);
            } else {
                // Обычное сообщение
                sendWs({type:'SendMessage',conversation_id:activeConversation.id,content:txt,reply_to_id:null});
            }
            
            inp.textContent = '';
            document.getElementById('send-btn').disabled = true;
        };
        
        window.handleInput = function(el) { document.getElementById('send-btn').disabled=!el.textContent.trim(); };
        window.handleKey = function(e,el) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} };
        
        window.toggleEmojiPicker = function() {
            showEmojiPicker = !showEmojiPicker;
            renderMain();
        };
        
        window.insertEmoji = function(emoji) {
            const inp = document.querySelector('.message-input-box');
            inp.textContent += emoji;
            document.getElementById('send-btn').disabled = false;
            showEmojiPicker = false;
            renderMain();
        };
        
        window.attachFileClick = function() {
            document.getElementById('file-upload-input').click();
        };
        
        window.handleFileSelect = function(e) {
            const file = e.target.files[0];
            if(file) {
                pendingFile = file;
                renderMain();
            }
        };
        
        window.clearPendingFile = function() {
            pendingFile = null;
            renderMain();
        };
        
        window.uploadAvatarClick = function() {
            document.getElementById('avatar-upload-input').click();
        };
        
        window.handleAvatarUpload = function(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                const base64 = ev.target.result.split(',')[1];
                sendWs({
                    type:'UpdateProfile',
                    avatar_url: `data:${file.type};base64,${base64}`
                });
            };
            reader.readAsDataURL(file);
        };

        // Настройки чата и профиля
        window.openChatSettings = function() {
            if(!activeConversation) return;
            
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'chat-settings-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="modal-title">Настройки чата</h3>
                    
                    <div style="margin-bottom:20px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">Название чата</label>
                        <input type="text" id="chat-name-input" class="form-input" value="${escapeHtml(getConversationTitle(activeConversation))}" ${activeConversation.is_group ? '' : 'disabled'}>
                        ${!activeConversation.is_group ? '<div style="font-size:12px;color:var(--tg-hint);margin-top:4px">Для личных чатов название недоступно</div>' : ''}
                    </div>
                    
                    <div style="margin-bottom:20px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">Ваше имя для контакта</label>
                        <input type="text" id="custom-name-input" class="form-input" placeholder="Как вас называть в этом чате">
                        <div style="font-size:12px;color:var(--tg-hint);margin-top:4px">Это имя будет видно только вам</div>
                    </div>
                    
                    <div style="margin-bottom:24px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">Настройки профиля</label>
                        <button onclick="openProfileSettings()" style="width:100%;padding:14px;background:var(--gradient-primary);border:none;border-radius:12px;color:white;cursor:pointer;font-weight:600;text-align:left;display:flex;align-items:center;gap:12px">
                            <span>👤</span> Изменить профиль
                        </button>
                    </div>
                    
                    <div style="display:flex;gap:8px;justify-content:flex-end">
                        <button onclick="closeChatSettings()" class="auth-button" style="background:var(--tg-tertiary-bg);padding:14px 24px">Закрыть</button>
                        ${activeConversation.is_group ? '<button onclick="saveChatName()" class="auth-button" style="padding:14px 24px">Сохранить</button>' : ''}
                    </div>
                </div>`;
            document.body.appendChild(modal);
        };

        window.closeChatSettings = function() {
            const modal = document.getElementById('chat-settings-modal');
            if(modal) modal.remove();
        };

        window.saveChatName = function() {
            const newName = document.getElementById('chat-name-input').value.trim();
            if(!newName) return;
            sendWs({type:'UpdateConversation',conversation_id:activeConversation.id,name:newName});
            closeChatSettings();
            showNotification('Название сохранено', 'success');
        };

        window.openProfileSettings = function() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'profile-settings-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="modal-title">Настройки профиля</h3>
                    
                    <div style="text-align:center;margin-bottom:20px">
                        <div class="chat-avatar" style="width:80px;height:80px;margin:0 auto 12px;font-size:32px">
                            ${getSelfAvatarUrl() ? '<img src="'+escapeHtml(getSelfAvatarUrl())+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">' : getInitials(profile?.display_name||profile?.messenger_id||'User')}
                        </div>
                        <button onclick="uploadAvatarClick()" style="padding:8px 16px;background:var(--tg-tertiary-bg);border:1px solid var(--tg-border);border-radius:8px;color:var(--tg-text);cursor:pointer;font-size:13px">Сменить аватар</button>
                    </div>
                    
                    <div style="margin-bottom:16px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">Отображаемое имя</label>
                        <input type="text" id="profile-display-name" class="form-input" value="${escapeHtml(profile?.display_name||'')}">
                    </div>
                    
                    <div style="margin-bottom:16px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">User ID</label>
                        <input type="text" id="profile-custom-id" class="form-input" value="${escapeHtml(profile?.custom_user_id||profile?.messenger_id||'')}" placeholder="@username">
                        <div style="font-size:12px;color:var(--tg-hint);margin-top:4px">Уникальный идентификатор для поиска</div>
                    </div>
                    
                    <div style="margin-bottom:24px">
                        <label style="display:block;font-size:12px;color:var(--tg-hint);text-transform:uppercase;margin-bottom:8px">О себе</label>
                        <textarea id="profile-about" class="form-input" rows="3" placeholder="Расскажите о себе">${escapeHtml(profile?.about||'')}</textarea>
                    </div>
                    
                    <div style="display:flex;gap:8px;justify-content:flex-end">
                        <button onclick="closeProfileSettings()" class="auth-button" style="background:var(--tg-tertiary-bg);padding:14px 24px">Отмена</button>
                        <button onclick="saveProfileSettings()" class="auth-button" style="padding:14px 24px">Сохранить</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        };

        window.closeProfileSettings = function() {
            const modal = document.getElementById('profile-settings-modal');
            if(modal) modal.remove();
        };

        window.saveProfileSettings = function() {
            const displayName = document.getElementById('profile-display-name').value.trim();
            const customUserId = document.getElementById('profile-custom-id').value.trim();
            const about = document.getElementById('profile-about').value.trim();
            
            if(!displayName) {
                showNotification('Введите отображаемое имя', 'error');
                return;
            }
            
            sendWs({
                type:'UpdateProfileSettings',
                display_name: displayName,
                custom_user_id: customUserId || null,
                about: about || null
            });
            
            closeProfileSettings();
            closeChatSettings();
            showNotification('Профиль обновлён', 'success');
        };
        
        window.addFriend = function() {
            // Modal для добавления друга
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.id = 'add-friend-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="modal-title">Добавить контакт</h3>
                    <div style="position:relative;margin-bottom:16px">
                        <input type="text" id="friend-input" placeholder="@username" class="form-input" autofocus>
                        <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--tg-hint)">🔍</span>
                    </div>
                    <div id="search-results" style="max-height:200px;overflow-y:auto;margin-bottom:16px"></div>
                    <div id="error-msg" style="color:#ef5350;font-size:13px;margin-bottom:16px;display:none"></div>
                    <div style="display:flex;gap:8px;justify-content:flex-end">
                        <button id="cancel-btn" class="auth-button" style="background:var(--tg-tertiary-bg);padding:14px 24px">Отмена</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);

            const input = document.getElementById('friend-input');
            const resultsDiv = document.getElementById('search-results');
            const errorDiv = document.getElementById('error-msg');
            const cancelBtn = document.getElementById('cancel-btn');

            let searchTimeout = null;

            input.oninput = () => {
                clearTimeout(searchTimeout);
                const q = input.value.trim();
                if(q.length < 2) { resultsDiv.innerHTML = ''; return; }
                
                searchTimeout = setTimeout(() => {
                    sendWs({type:'SearchUsers',query:q});
                }, 300);
            };

            window.handleSearchResults = function(profiles) {
                if(profiles.length === 0) {
                    resultsDiv.innerHTML = '<div style="padding:20px;text-align:center;color:var(--tg-hint)">Ничего не найдено</div>';
                    return;
                }
                resultsDiv.innerHTML = profiles.map(p => `
                    <div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--tg-hover);border-radius:12px;margin-bottom:8px;cursor:pointer" onclick="sendFriendRequest('${p.messenger_id}')">
                        <div class="chat-avatar" style="width:44px;height:44px;font-size:16px">${getInitials(p.display_name||'User')}</div>
                        <div style="flex:1">
                            <div style="font-weight:600">${p.display_name}</div>
                            <div style="font-size:13px;color:var(--tg-hint)">@${p.messenger_id}</div>
                        </div>
                        <button style="padding:8px 16px;background:var(--gradient-primary);border:none;border-radius:8px;color:white;cursor:pointer;font-weight:600">Добавить</button>
                    </div>
                `).join('');
            };

            window.sendFriendRequest = function(messengerId) {
                sendWs({type:'SendFriendRequest',receiver_messenger_id:messengerId});
                modal.remove();
                showNotification('Запрос отправлен', 'success');
            };

            cancelBtn.onclick = () => modal.remove();
            input.focus();
        };

        window.respondReq = function(id, accept) {
            sendWs({type:'RespondToFriendRequest',request_id:id,accept});
            loadConversations();
        };

        window.showNotification = function(message, type='info') {
            const notif = document.createElement('div');
            notif.style.cssText = `position:fixed;top:20px;right:20px;padding:16px 24px;background:${type==='success'?'var(--gradient-success)':'var(--gradient-primary)'};border-radius:12px;color:white;font-weight:600;box-shadow:var(--shadow-lg);z-index:10000;animation:slideUp 0.3s ease-out`;
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        };

        // Инициализация
        if(token) {
            connectWebSocket();
        } else {
            renderAuth();
        }
    </script>
</body>
</html>
