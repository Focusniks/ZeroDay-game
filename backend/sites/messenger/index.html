<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerogram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Zerogram — редизайн: тёмный glass, электрик-синий, 3 колонки */
        :root {
            --zg-bg: #14161c;
            --zg-bg-deep: #0e1015;
            --zg-surface: #1f2128;
            --zg-surface-2: #262a33;
            --zg-surface-glass: rgba(35, 38, 47, 0.72);
            --zg-border: rgba(255, 255, 255, 0.07);
            --zg-border-strong: rgba(255, 255, 255, 0.12);
            --zg-text: #f4f5f7;
            --zg-muted: #8b92a5;
            --zg-blue: #0d84ff;
            --zg-blue-dim: rgba(13, 132, 255, 0.14);
            --zg-blue-glow: rgba(13, 132, 255, 0.42);
            --zg-msg-in: #2a2e38;
            --zg-msg-out: linear-gradient(135deg, #0d84ff 0%, #0066dd 100%);
            --zg-online: #3dd68c;
            --zg-radius-lg: 20px;
            --zg-radius-md: 14px;
            --zg-radius-sm: 10px;
            --zg-shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.35);
            --zg-shadow-glow: 0 0 24px var(--zg-blue-glow);
            /* legacy aliases for inline styles in JS */
            --tg-bg: var(--zg-bg);
            --tg-secondary-bg: var(--zg-surface);
            --tg-tertiary-bg: var(--zg-surface-2);
            --tg-text: var(--zg-text);
            --tg-hint: var(--zg-muted);
            --tg-link: var(--zg-blue);
            --tg-border: var(--zg-border-strong);
            --tg-hover: var(--zg-surface-2);
            --tg-active: rgba(13, 132, 255, 0.18);
            --tg-online: var(--zg-online);
            --tg-offline: #6b7280;
            --gradient-primary: linear-gradient(135deg, #0d84ff 0%, #0056d6 100%);
            --gradient-success: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --gradient-warning: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.35);
            --shadow-lg: var(--zg-shadow-soft);
            --shadow-glow: var(--zg-shadow-glow);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--zg-bg-deep);
            color: var(--zg-text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            letter-spacing: -0.01em;
        }

        .tg-selectable { user-select: text; -webkit-user-select: text; cursor: text; }

        /* ——— Auth / Setup ——— */
        .auth-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(13, 132, 255, 0.12), transparent 50%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(100, 80, 200, 0.08), transparent 45%),
                var(--zg-bg-deep);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 44px 40px;
            border-radius: var(--zg-radius-lg);
            background: var(--zg-surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--zg-border);
            box-shadow: var(--zg-shadow-soft), 0 0 0 1px rgba(255,255,255,0.03) inset;
            animation: zgFadeUp 0.45s ease-out;
        }

        @keyframes zgFadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo { text-align: center; margin-bottom: 28px; }
        .auth-logo-icon {
            width: 88px; height: 88px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: var(--gradient-primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            box-shadow: var(--zg-shadow-glow);
        }
        .auth-logo h1 {
            font-size: 28px; font-weight: 700;
            color: var(--zg-text);
            letter-spacing: -0.03em;
        }
        .auth-logo p { color: var(--zg-muted); margin-top: 8px; font-size: 14px; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 11px; font-weight: 600;
            color: var(--zg-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--zg-border);
            border-radius: var(--zg-radius-md);
            color: var(--zg-text);
            font-size: 15px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            border-color: rgba(13, 132, 255, 0.55);
            box-shadow: 0 0 0 3px var(--zg-blue-dim);
        }
        .form-input::placeholder { color: var(--zg-muted); opacity: 0.8; }

        .auth-button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: var(--zg-radius-md);
            background: var(--gradient-primary);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(13, 132, 255, 0.35);
        }
        .auth-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(13, 132, 255, 0.45);
        }
        .auth-button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .auth-error {
            display: none;
            padding: 12px 14px;
            margin-bottom: 16px;
            border-radius: var(--zg-radius-sm);
            background: rgba(239, 83, 80, 0.12);
            border: 1px solid rgba(239, 83, 80, 0.35);
            color: #ff8a80;
            font-size: 14px;
        }
        .auth-error.visible { display: block; }

        /* ——— App shell: rail + list + main ——— */
        .messenger-container,
        .zg-app {
            display: flex;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
            background: var(--zg-bg);
            -webkit-touch-callout: none;
        }
        .zg-app img { -webkit-user-drag: none; user-select: none; }

        .zg-rail {
            width: 76px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px 0 16px;
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--zg-border);
            z-index: 5;
        }
        .zg-rail__logo {
            width: 44px; height: 44px;
            border-radius: 14px;
            background: var(--gradient-primary);
            color: #fff;
            font-weight: 800;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--zg-shadow-glow);
            letter-spacing: -0.05em;
        }
        .zg-rail__nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 28px;
            width: 100%;
            align-items: center;
        }
        .zg-rail-btn {
            position: relative;
            width: 48px; height: 48px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: var(--zg-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .zg-rail-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            font-size: 10px;
            font-weight: 700;
            line-height: 16px;
            border-radius: 999px;
            background: var(--zg-blue);
            color: #fff;
            text-align: center;
            pointer-events: none;
        }
        .zg-rail-badge.hidden { display: none !important; }
        .zg-rail-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .zg-rail-btn:hover { color: var(--zg-text); background: rgba(255,255,255,0.05); }
        .zg-rail-btn.is-active {
            color: var(--zg-blue);
            background: var(--zg-blue-dim);
            box-shadow: 0 0 0 1px rgba(13, 132, 255, 0.35);
        }
        .zg-rail__footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-top: 12px;
        }
        .zg-rail-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: 2px solid var(--zg-border-strong);
            overflow: hidden;
            background: var(--zg-surface-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: box-shadow 0.2s;
        }
        .zg-rail-avatar:hover { box-shadow: 0 0 0 2px rgba(13, 132, 255, 0.4); }
        .zg-rail-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .zg-list-panel {
            width: 360px;
            min-width: 300px;
            max-width: 420px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: var(--zg-surface);
            border-right: 1px solid var(--zg-border);
        }
        .zg-list-panel__top {
            padding: 20px 20px 12px;
            border-bottom: 1px solid var(--zg-border);
        }
        .zg-list-panel__title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 10px;
        }
        .zg-list-panel__title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        .zg-list-panel__tools {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .zg-icon-tool {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: 1px solid var(--zg-border);
            background: rgba(0,0,0,0.2);
            color: var(--zg-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .zg-icon-tool:hover {
            color: var(--zg-text);
            border-color: rgba(13, 132, 255, 0.4);
            background: var(--zg-blue-dim);
        }
        .zg-search-wrap {
            position: relative;
            margin-bottom: 4px;
        }
        .zg-search-wrap .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--zg-muted);
            font-size: 15px;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border-radius: var(--zg-radius-md);
            border: 1px solid var(--zg-border);
            background: rgba(0,0,0,0.22);
            color: var(--zg-text);
            font-size: 14px;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: rgba(13, 132, 255, 0.5);
            box-shadow: 0 0 0 3px var(--zg-blue-dim);
        }
        .search-input::placeholder { color: var(--zg-muted); }

        .zg-tabs {
            display: flex;
            gap: 4px;
            padding: 0 20px;
            margin-top: 4px;
        }
        .tab {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--zg-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .tab:hover { color: var(--zg-text); }
        .tab.active {
            color: #fff;
            background: rgba(13, 132, 255, 0.22);
            box-shadow: 0 0 0 1px rgba(13, 132, 255, 0.25);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px 16px;
        }
        .chat-list::-webkit-scrollbar { width: 6px; }
        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 4px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: var(--zg-radius-md);
            cursor: pointer;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .chat-item:hover {
            background: rgba(255,255,255,0.04);
        }
        .chat-item.active {
            background: rgba(13, 132, 255, 0.16);
            border-color: rgba(13, 132, 255, 0.35);
            box-shadow: 0 0 20px rgba(13, 132, 255, 0.12);
        }

        /* Обёртка без overflow — индикатор онлайна не обрезается */
        .chat-avatar-wrap {
            position: relative;
            flex-shrink: 0;
            width: 52px;
            height: 52px;
        }
        .chat-avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            overflow: hidden;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-avatar-wrap.online::after {
            content: '';
            position: absolute;
            top: -2px;
            right: -2px;
            width: 13px;
            height: 13px;
            background: var(--zg-online);
            border: 2px solid var(--zg-surface);
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
        }
        .chat-avatar-wrap.offline::after {
            content: '';
            position: absolute;
            top: -1px;
            right: -1px;
            width: 11px;
            height: 11px;
            background: #6b7280;
            border: 2px solid var(--zg-surface);
            border-radius: 50%;
            z-index: 2;
        }

        .chat-info { flex: 1; min-width: 0; }
        .chat-name-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
            gap: 8px;
        }
        .chat-name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-time { font-size: 11px; color: var(--zg-muted); flex-shrink: 0; }
        .chat-preview { display: flex; align-items: center; gap: 8px; }
        .chat-preview-text {
            font-size: 13px;
            color: var(--zg-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .chat-preview-text.own { color: var(--zg-blue); }

        .unread-badge {
            background: var(--zg-blue);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 999px;
            min-width: 20px;
            text-align: center;
        }
        .unread-badge.hidden { display: none !important; }

        /* Main chat column */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: linear-gradient(180deg, #181b22 0%, #14161c 100%);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 22px;
            background: rgba(31, 33, 40, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--zg-border);
            flex-shrink: 0;
        }
        .chat-header-avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }
        .chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-header-info { flex: 1; min-width: 0; }
        .chat-header-name {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.02em;
        }
        .chat-header-status { font-size: 13px; color: var(--zg-muted); margin-top: 2px; }
        .chat-header-status.online { color: var(--zg-online); }

        .zg-header-actions {
            display: flex;
            gap: 4px;
        }
        .icon-btn {
            width: 42px; height: 42px;
            border-radius: 12px;
            border: 1px solid var(--zg-border);
            background: rgba(0,0,0,0.2);
            color: var(--zg-muted);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .icon-btn:hover {
            color: var(--zg-text);
            border-color: rgba(13, 132, 255, 0.35);
            background: var(--zg-blue-dim);
        }

        .load-more-wrap {
            padding: 10px 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .load-more-btn {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--zg-border);
            background: rgba(255,255,255,0.04);
            color: var(--zg-text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .load-more-btn:hover {
            border-color: rgba(13, 132, 255, 0.45);
            background: var(--zg-blue-dim);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .messages-container::-webkit-scrollbar { width: 8px; }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: min(72%, 560px);
        }
        .message.message--enter {
            animation: zgMsgIn 0.22s ease-out;
        }
        @keyframes zgMsgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.own {
            margin-left: auto;
            flex-direction: row-reverse;
            max-width: min(72%, 520px);
        }

        .message-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .message-bubble {
            background: var(--zg-msg-in);
            border-radius: 18px;
            padding: 10px 14px;
            border: 1px solid var(--zg-border);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .message.own .message-bubble {
            background: var(--zg-msg-out);
            border: none;
            border-radius: 18px 18px 6px 18px;
            box-shadow: 0 6px 20px rgba(13, 132, 255, 0.25);
        }
        .message:not(.own) .message-bubble {
            border-radius: 18px 18px 18px 6px;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: var(--zg-blue);
            margin-bottom: 4px;
        }
        .message-text {
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            color: var(--zg-text);
        }
        .message.own .message-text { color: #fff; }

        .message-image {
            max-width: 280px;
            border-radius: 12px;
            margin-top: 8px;
            cursor: pointer;
        }
        .message-file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-top: 8px;
            border-radius: 12px;
            background: rgba(0,0,0,0.25);
            cursor: pointer;
        }
        .message-file-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(13, 132, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .message-file-name { font-weight: 600; font-size: 13px; }
        .message-file-size { font-size: 11px; color: var(--zg-muted); }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 6px;
        }
        .message-time { font-size: 11px; color: rgba(255,255,255,0.45); }
        .message.own .message-time { color: rgba(255,255,255,0.65); }
        .message-read { font-size: 11px; color: rgba(255,255,255,0.85); }

        .typing-indicator {
            padding: 8px 22px;
            font-size: 13px;
            color: var(--zg-muted);
            font-style: italic;
            flex-shrink: 0;
        }

        .message-input-container {
            position: relative;
            padding: 14px 20px 18px;
            background: rgba(20, 22, 28, 0.95);
            border-top: 1px solid var(--zg-border);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }
        .message-input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }
        .input-actions { display: flex; gap: 4px; }
        .input-action-btn {
            width: 42px; height: 42px;
            border-radius: 12px;
            border: 1px solid var(--zg-border);
            background: rgba(0,0,0,0.2);
            color: var(--zg-muted);
            cursor: pointer;
            font-size: 18px;
            display: flex;

<body>
    <div id="app"></div>
    <input id="avatar-upload-input" type="file" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
    <input id="file-upload-input" type="file" style="display:none" onchange="handleFileSelect(event)">
    <div id="zg-ctx-menu" class="zg-ctx-menu" role="menu" aria-hidden="true">
        <button type="button" id="zg-ctx-edit">Изменить</button>
        <button type="button" id="zg-ctx-delete" class="danger">Удалить</button>
    </div>
    <script>
        // Конфигурация - читаем из URL параметров если есть
        (function() {
            const params = new URLSearchParams(window.location.search);
            const wsUrlParam = params.get('ws_url');
            const httpUrlParam = params.get('http_url');
            
            window.ENV = {
                WS_HOST: '127.0.0.1',
                WS_PORT: '8080',
                WS_URL: wsUrlParam || 'ws://127.0.0.1:8080/ws',
                HTTP_HOST: '127.0.0.1',
                HTTP_PORT: '8000',
                HTTP_URL: httpUrlParam || 'http://127.0.0.1:8000/api'
            };
        })();

        const WS_URL = window.ENV.WS_URL;
        const HTTP_URL = window.ENV.HTTP_URL;

        let token = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('zeroday.token');
        let ws = null;
        let profile = null;
        let conversations = [];
        let activeConversation = null;
        let messages = [];
        let activeTab = 'chats';
        let searchQuery = '';
        let friendSearchQuery = '';
        let friendSearchResults = [];
        let friendSearchLoading = false;
        let friendSearchTimeout = null;
        let friendRequests = [];
        let outgoingFriendRequests = [];
        let friendActionBanner = null;
        let friendBannerDismissTimer = null;
        let friendRequestSendingMid = null;
        let contacts = [];
        let typingUsers = new Map();
        let filteredConversations = [];
        let pendingFile = null;
        let showEmojiPicker = false;
        let wsConnected = false;
        let heartbeatIntervalId = null;
        let reconnectAttempts = 0;
        let reconnectTimeoutId = null;
        let hasMoreMessages = false;
        let messageReactions = {};
        let optimisticMessages = [];
        let loadingOlderMessages = false;
        let typingDebounceTimer = null;
        let typingSent = false;
        let ctxMenuMessageId = null;
        let conversationsRefreshTimer = null;
        const WS_DEBUG = false;
        let appScreen = 'main';

        // === Helper Functions ===
        function displayNameForOtherUser(ou) {
            if (!ou) return 'Контакт';
            const nick = ou.custom_name != null && String(ou.custom_name).trim() !== '' ? String(ou.custom_name).trim() : null;
            const base = ou.username != null ? (typeof ou.username === 'string' ? ou.username : String(ou.username)) : '';
            return nick || base || 'Контакт';
        }

        function getConversationTitle(c) {
            if (!c) return 'Чат';
            if (c.is_group) return String(c.name != null ? c.name : 'Групповой чат');
            if (c.other_user) return displayNameForOtherUser(c.other_user);
            return 'Контакт';
        }

        function getAvatarInitials(convOrName) {
            const name = typeof convOrName === 'string' ? convOrName : getConversationTitle(convOrName);
            const s = String(name || '').trim();
            if (!s) return '?';
            return s.split(/\s+/).filter(Boolean).map(function(n) { return n[0]; }).join('').toUpperCase().slice(0, 2);
        }

        function getConversationAvatarUrl(c) {
            if (!c) return null;
            return c.is_group ? (c.avatar_url || null) : (c.other_user?.avatar_url || null);
        }

        function getSelfAvatarUrl() {
            return profile?.avatar_url || null;
        }

        function normalizeConversations(input) {
            const map = new Map();
            (input || []).forEach(c => {
                const key = c.is_group ? `group:${c.id}` : `dm:${c.other_user?.id || c.id}`;
                const existing = map.get(key);
                if (!existing) { map.set(key, c); return; }
                const existingTs = new Date(existing.updated_at || 0).getTime();
                const nextTs = new Date(c.updated_at || 0).getTime();
                if (nextTs >= existingTs) {
                    map.set(key, { ...existing, ...c, unread_count: Math.max(existing.unread_count || 0, c.unread_count || 0) });
                }
            });
            return Array.from(map.values()).sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now.getTime() - date.getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days === 0) return date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            if (days === 1) return 'Вчера';
            if (days < 7) return date.toLocaleDateString('ru-RU',{weekday:'long'});
            return date.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
        }

        function getInitials(name) {
            const s = typeof name === 'string' ? name : String(name != null ? name : '');
            if (!s.trim()) return '?';
            return s.split(/\s+/).filter(Boolean).map(function(n) { return n[0]; }).join('').toUpperCase().slice(0, 2);
        }

        function formatLastSeen(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diff = now.getTime() - date.getTime();
            const minutes = Math.floor(diff / (1000 * 60));
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (minutes < 1) return 'был(а) только что';
            if (minutes < 60) return `был(а) ${minutes} мин. назад`;
            if (hours < 24) return `был(а) ${hours} ч. назад`;
            if (days === 1) return 'был(а) вчера';
            if (days < 7) return `был(а) ${days} дн. назад`;
            return `был(а) ${date.toLocaleDateString('ru-RU')}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function scheduleConversationsRefresh() {
            if (conversationsRefreshTimer) clearTimeout(conversationsRefreshTimer);
            conversationsRefreshTimer = setTimeout(function() {
                conversationsRefreshTimer = null;
                sendWs({ type: 'GetConversations' });
            }, 400);
        }

        function updateActiveChatHeaderFromState() {
            if (!activeConversation) return;
            const nameEl = document.querySelector('.chat-header-name');
            const statusEl = document.querySelector('.chat-header-status');
            const avEl = document.querySelector('.chat-header-avatar');
            if (!nameEl || !statusEl) return;
            nameEl.textContent = getConversationTitle(activeConversation);
            const ou = activeConversation.other_user;
            const online = ou && ou.is_online;
            statusEl.className = 'chat-header-status' + (online ? ' online' : '');
            statusEl.textContent = online ? 'онлайн' : (ou && ou.last_seen ? formatLastSeen(ou.last_seen) : 'оффлайн');
            if (avEl) {
                const url = getConversationAvatarUrl(activeConversation);
                if (url) {
                    avEl.innerHTML = '<img src="' + escapeHtml(url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
                } else {
                    avEl.textContent = '';
                    avEl.innerHTML = '';
                    avEl.appendChild(document.createTextNode(getAvatarInitials(activeConversation)));
                }
            }
        }

        function beginEditMessage(mid) {
            const m = messages.find(function(x) { return String(x.id) === String(mid); });
            if (!m || m.pending) return;
            const ov = document.createElement('div');
            ov.className = 'modal-overlay';
            ov.id = 'edit-msg-overlay';
            const taId = 'edit-msg-ta-' + String(mid).slice(0, 8);
            ov.innerHTML = '<div class="modal-content" style="max-width:420px">' +
                '<h3 class="modal-title">Изменить сообщение</h3>' +
                '<textarea id="' + taId + '" class="form-input tg-selectable" rows="4" style="resize:vertical;width:100%"></textarea>' +
                '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
                '<button type="button" class="auth-button" style="background:var(--tg-tertiary-bg);padding:12px 20px" id="edit-msg-cancel">Отмена</button>' +
                '<button type="button" class="auth-button" style="padding:12px 20px" id="edit-msg-save">Сохранить</button>' +
                '</div></div>';
            document.body.appendChild(ov);
            var ta = document.getElementById(taId);
            if (ta) ta.value = m.content || '';
            document.getElementById('edit-msg-cancel').onclick = function() { ov.remove(); };
            document.getElementById('edit-msg-save').onclick = function() {
                var t = ta && ta.value.trim();
                if (!t) return;
                var ci = messages.findIndex(function(x) { return String(x.id) === String(mid); });
                if (ci >= 0) {
                    messages[ci] = Object.assign({}, messages[ci], { content: t, edited: true });
                    renderMessages();
                }
                ov.remove();
                sendWs({ type: 'EditMessage', message_id: String(mid), content: t });
            };
        }

        // === WebSocket ===
        function clearHeartbeat() {
            if (heartbeatIntervalId) {
                clearInterval(heartbeatIntervalId);
                heartbeatIntervalId = null;
            }
        }

        function connectWebSocket() {
            if(!token) return;
            if (reconnectTimeoutId) {
                clearTimeout(reconnectTimeoutId);
                reconnectTimeoutId = null;
            }
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                wsConnected = true;
                reconnectAttempts = 0;
                clearHeartbeat();
                console.log('✓ Connected');
                ws.send(JSON.stringify({type:'Authorize',token}));
                heartbeatIntervalId = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({type:'UpdateActivity'}));
                    }
                }, 12000);
                updateConnectionIndicator();
                if (appScreen === 'settings') renderSettingsPage();
            };
            ws.onclose = () => {
                wsConnected = false;
                clearHeartbeat();
                console.log('✗ Disconnected');
                updateConnectionIndicator();
                if (token) {
                    const delay = Math.min(30000, 500 * Math.pow(2, reconnectAttempts));
                    reconnectAttempts++;
                    reconnectTimeoutId = setTimeout(connectWebSocket, delay);
                }
            };
            ws.onerror = e => console.error('WS Error:',e);
            ws.onmessage = e => {
                try {
                    const data = JSON.parse(e.data);
                    handleWsMessage(data);
                } catch(err) { console.error('Parse error:',err); }
            };
        }

        function updateConnectionIndicator() {
            const el = document.getElementById('ws-status');
            if (el) {
                el.className = 'ws-status ' + (wsConnected ? 'ws-connected' : 'ws-disconnected');
                el.title = wsConnected ? 'Подключено' : 'Нет соединения. Нажмите для переподключения';
                el.textContent = '';
            }
        }

        window.reconnectWs = function() {
            reconnectAttempts = 0;
            if (reconnectTimeoutId) {
                clearTimeout(reconnectTimeoutId);
                reconnectTimeoutId = null;
            }
            if (ws) { try { ws.close(); } catch(e) {} ws = null; }
            connectWebSocket();
        };

        function sendWs(msg) {
            if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(msg));
        }

        function handleWsMessage(data) {
            if (WS_DEBUG) console.log('WS:', data.type, data);
            try {
            switch(data.type) {
                case 'AuthSuccess':
                    localStorage.setItem('zeroday.token',data.token);
                    token = data.token;
                    sendWs({type:'GetProfile'});
                    break;
                case 'AuthError':
                    console.error('Messenger Auth Error:', data);
                    localStorage.removeItem('zeroday.token');
                    alert('Ошибка авторизации: ' + data.message + '\\n\\nОбновите страницу или войдите заново.');
                    window.location.href = '/';
                    break;
                case 'Profile':
                    profile = data.profile;
                    if(data.profile.is_setup_complete) {
                        renderActiveView();
                        loadConversations();
                        startOnlinePoll();
                    } else renderSetup();
                    break;
                case 'ConversationsList':
                    conversations = normalizeConversations(data.conversations || []);
                    renderChatList();
                    
                    // Подсчитываем общее количество непрочитанных сообщений и отправляем в родительское окно
                    const totalUnread = conversations.reduce((sum, c) => sum + (c.unread_count || 0), 0);
                    if (window.sendToParent) {
                        window.sendToParent('unread_count', { count: totalUnread });
                    }
                    
                    if (activeConversation) {
                        const stillExists = conversations.find(c => c.id === activeConversation.id);
                        if (stillExists) {
                            activeConversation = stillExists;
                            if (messages.length === 0) {
                                sendWs({ type: 'GetMessages', conversation_id: activeConversation.id, limit: 50 });
                            }
                            updateActiveChatHeaderFromState();
                        } else {
                            activeConversation = null;
                            messages = [];
                            if (appScreen === 'settings') renderSettingsPage();
                            else renderMain();
                        }
                    }
                    break;
                case 'ConversationCreated':
                    if(window.handleConversationCreated) {
                        window.handleConversationCreated(data.conversation);
                    }
                    break;
                case 'MessagesList':
                    const incoming = (data.messages||[]).reverse();
                    if (loadingOlderMessages) {
                        messages = [...incoming, ...messages];
                        loadingOlderMessages = false;
                        hasMoreMessages = data.has_more === true;
                        renderMessages();
                        if (activeConversation) {
                            sendWs({ type: 'GetReactionsForConversation', conversation_id: activeConversation.id });
                        }
                    } else {
                        messages = incoming;
                        hasMoreMessages = data.has_more === true;
                        if (activeConversation) {
                            sendWs({ type: 'GetReactionsForConversation', conversation_id: activeConversation.id });
                        } else {
                            renderMessages();
                        }
                    }
                    break;
                case 'MessageSent':
                    if (data.message) {
                        const idx = messages.findIndex(m => m.pending && m.conversation_id === data.message.conversation_id && String(m.sender_id) === String(data.message.sender_id));
                        if (idx >= 0) messages.splice(idx, 1);
                        handleMessageUpdate(data.message);
                    }
                    break;
                case 'MessageReceived':
                    if (data.message) {
                        const msg = data.message;
                        // Если чат открыт — добавляем сообщение
                        if (activeConversation && msg.conversation_id === activeConversation.id) {
                            handleMessageUpdate(msg);
                            // Прокрутка вниз
                            setTimeout(() => {
                                const container = document.querySelector('.messages-container');
                                if (container) container.scrollTop = container.scrollHeight;
                            }, 50);
                        }
                        // Обновляем список чатов (чтобы показать новое сообщение в списке)
                        sendWs({ type: 'GetConversations' });
                        
                        // Отправляем уведомление в родительское окно
                        const isChatOpen = activeConversation && msg.conversation_id === activeConversation.id;
                        if (window.sendToParent) {
                            window.sendToParent('message_received', {
                                message: msg,
                                isChatOpen: isChatOpen
                            });
                        }
                        
                        // Показываем уведомление если чат не открыт
                        if (!activeConversation || msg.conversation_id !== activeConversation.id) {
                            showNotification('Новое сообщение', 'info');
                        }
                    }
                    break;
                case 'FriendRequestsList':
                    friendRequests = data.requests || [];
                    outgoingFriendRequests = data.outgoing || [];
                    updateBadge();
                    if(activeTab==='contacts') renderContacts();
                    break;
                case 'FriendRequestCancelled':
                    showNotification('Исходящий запрос отменён', 'success');
                    sendWs({ type: 'GetFriendRequests' });
                    sendWs({ type: 'GetContactsOnline' });
                    if (activeTab === 'contacts') renderChatList();
                    break;
                case 'ContactsList':
                    contacts = data.contacts||[];
                    if(activeTab==='contacts') renderContacts();
                    break;
                case 'ContactsOnlineList':
                    contacts = data.contacts||[];
                    if(activeTab==='contacts') renderContacts();
                    break;
                case 'ProfilesList':
                    friendSearchResults = data.profiles || [];
                    friendSearchLoading = false;
                    if (activeTab === 'contacts') renderChatList();
                    break;
                case 'FriendRequestSent':
                    friendRequestSendingMid = null;
                    setFriendFeedback('Запрос отправлен. Он в разделе «Исходящие» — при необходимости отмените.', 'success', 7000);
                    showNotification('Запрос в друзья отправлен', 'success');
                    sendWs({ type: 'GetFriendRequests' });
                    sendWs({ type: 'GetContactsOnline' });
                    if (activeTab === 'contacts') renderChatList();
                    break;
                case 'FriendRequestResponded':
                    sendWs({ type: 'GetFriendRequests' });
                    sendWs({ type: 'GetContactsOnline' });
                    sendWs({ type: 'GetConversations' });
                    if (data.accepted) showNotification('Контакт добавлен', 'success');
                    if (activeTab === 'contacts') renderChatList();
                    break;
                case 'Error':
                    loadingOlderMessages = false;
                    if (data.code === 'reaction_error') {
                        showNotification(data.message || 'Реакция не сохранена', 'error');
                        if (activeConversation) {
                            sendWs({ type: 'GetReactionsForConversation', conversation_id: activeConversation.id });
                        }
                    }
                    else if (data.code === 'send_error' && window.handleSendError) {
                        console.log('Send error received:', data);
                        window.handleSendError(data.message);
                    }
                    else if (data.code === 'request_error') {
                        friendRequestSendingMid = null;
                        setFriendFeedback(data.message || 'Не удалось отправить запрос в друзья', 'error', 10000);
                        showNotification(data.message || 'Ошибка запроса в друзья', 'error');
                        if (window.handleFriendRequestError) {
                            window.handleFriendRequestError(data.message);
                        }
                        if (activeTab === 'contacts') renderChatList();
                    }
                    else if (data.code === 'cancel_error') {
                        showNotification(data.message || 'Не удалось отменить запрос', 'error');
                    }
                    else if (data.code === 'not_found') {
                        renderSetup();
                    }
                    else if (data.code === 'delete_error' || data.code === 'edit_error') {
                        showNotification(data.message || 'Операция не выполнена', 'error');
                        if (activeConversation) {
                            sendWs({ type: 'GetMessages', conversation_id: activeConversation.id, limit: 50 });
                            sendWs({ type: 'GetReactionsForConversation', conversation_id: activeConversation.id });
                        }
                    }
                    else if (data.code === 'update_error') {
                        showNotification(data.message || 'Не удалось сохранить', 'error');
                        sendWs({ type: 'GetConversations' });
                        sendWs({ type: 'GetContactsOnline' });
                        sendWs({ type: 'GetProfile' });
                    }
                    else {
                        console.error('Messenger Error:', data);
                    }
                    break;
                case 'UserTyping':
                    if (activeConversation && data.conversation_id === activeConversation.id && data.user_id !== profile?.user_id) {
                        typingUsers.set(data.user_id, data.username || data.user_id);
                        updateTypingIndicator();
                    }
                    break;
                case 'UserStoppedTyping':
                    if (data.user_id) typingUsers.delete(data.user_id);
                    updateTypingIndicator();
                    break;
                case 'OnlineStatus':
                    if (data.statuses && Array.isArray(data.statuses)) {
                        data.statuses.forEach(s => {
                            const uid = String(s.user_id);
                            conversations.forEach(c => {
                                if (c.other_user && String(c.other_user.id) === uid) {
                                    c.other_user.is_online = s.is_online;
                                    if (s.last_seen) c.other_user.last_seen = s.last_seen;
                                }
                            });
                            contacts.forEach(c => {
                                if (String(c.contact_user_id) === uid) {
                                    c.is_online = s.is_online;
                                    if (s.last_seen) c.last_seen = s.last_seen;
                                }
                            });
                        });
                        if (activeConversation && activeConversation.other_user) {
                            const uid = String(activeConversation.other_user.id);
                            const s = data.statuses.find(x => String(x.user_id) === uid);
                            if (s) {
                                activeConversation.other_user.is_online = s.is_online;
                                if (s.last_seen) activeConversation.other_user.last_seen = s.last_seen;
                            }
                        }
                        renderChatList();
                        updateActiveChatHeaderFromState();
                    }
                    break;
                case 'ReactionsForConversation':
                    if (data.conversation_id === activeConversation?.id && data.reactions) {
                        const cid = String(data.conversation_id);
                        messageReactions[cid] = {};
                        data.reactions.forEach(r => {
                            const mid = String(r.message_id);
                            if (!messageReactions[cid][mid]) messageReactions[cid][mid] = [];
                            messageReactions[cid][mid].push({ emoji: r.emoji, user_id: r.user_id });
                        });
                        renderMessages();
                    }
                    break;
                case 'ReactionAdded':
                    if (data.reaction) {
                        const r = data.reaction;
                        const convId = activeConversation?.id;
                        if (convId) {
                            const cid = String(convId);
                            if (!messageReactions[cid]) messageReactions[cid] = {};
                            const mid = String(r.message_id);
                            if (!messageReactions[cid][mid]) messageReactions[cid][mid] = [];
                            const uid = String(r.user_id);
                            if (!messageReactions[cid][mid].some(x => x.emoji === r.emoji && String(x.user_id) === uid)) {
                                messageReactions[cid][mid].push({ emoji: r.emoji, user_id: r.user_id });
                            }
                            renderMessages();
                        }
                    }
                    break;
                case 'ReactionRemoved':
                    if (data.message_id && data.emoji && activeConversation) {
                        const mid = String(data.message_id);
                        const cid = String(activeConversation.id);
                        const arr = messageReactions[cid]?.[mid];
                        if (arr) {
                            const uid = data.user_id ? String(data.user_id) : '';
                            const idx = arr.findIndex(x => x.emoji === data.emoji && (!uid || String(x.user_id) === uid));
                            if (idx >= 0) arr.splice(idx, 1);
                            renderMessages();
                        }
                    }
                    break;
                case 'MessageDeleted':
                    if (data.message_id && data.conversation_id) {
                        const mid = String(data.message_id);
                        const cid = String(data.conversation_id);
                        messages = messages.filter(m => String(m.id) !== mid);
                        if (messageReactions[cid] && messageReactions[cid][mid]) {
                            delete messageReactions[cid][mid];
                        }
                        if (activeConversation && String(activeConversation.id) === cid) {
                            renderMessages();
                        }
                        scheduleConversationsRefresh();
                    }
                    break;
                case 'MessageUpdated':
                    if (data.message) {
                        const u = data.message;
                        const mid = String(u.id);
                        const ci = messages.findIndex(m => String(m.id) === mid);
                        if (ci >= 0) {
                            messages[ci] = Object.assign({}, messages[ci], {
                                content: u.content,
                                edited: u.edited,
                                updated_at: u.updated_at,
                                sender_username: u.sender_username != null ? u.sender_username : messages[ci].sender_username
                            });
                        }
                        if (activeConversation && String(u.conversation_id) === String(activeConversation.id)) {
                            renderMessages();
                        }
                        const conv = conversations.find(c => String(c.id) === String(u.conversation_id));
                        if (conv && conv.last_message && String(conv.last_message.id) === mid) {
                            conv.last_message = Object.assign({}, conv.last_message, {
                                content: u.content,
                                edited: u.edited
                            });
                            renderChatList();
                        }
                        scheduleConversationsRefresh();
                    }
                    break;
            }
            } catch (err) {
                console.error('handleWsMessage error:', err, data);
            }
        }

        function updateTypingIndicator() {
            const el = document.getElementById('typing');
            if (!el) return;
            if (typingUsers.size > 0) {
                el.textContent = Array.from(typingUsers.values()).join(', ') + ' печатает...';
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function handleMessageUpdate(msg) {
            const viewing = activeConversation && String(activeConversation.id) === String(msg.conversation_id);
            const idx = conversations.findIndex(c=>c.id===msg.conversation_id);
            if(idx!==-1) {
                conversations[idx].last_message = msg;
                conversations[idx].updated_at = msg.created_at;
                if (!viewing && String(msg.sender_id) !== String(profile?.user_id)) {
                    conversations[idx].unread_count = (conversations[idx].unread_count || 0) + 1;
                }
            } else {
                // Чат не найден - добавляем новый
                conversations.unshift({
                    id: msg.conversation_id,
                    last_message: msg,
                    updated_at: msg.created_at,
                    unread_count: msg.sender_id !== profile?.user_id ? 1 : 0,
                    is_group: false,
                    other_user: msg.sender_id !== profile?.user_id ? { 
                        id: msg.sender_id, 
                        username: msg.sender_username,
                        is_online: false 
                    } : null
                });
            }
            
            // Сортируем по времени
            conversations.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
            renderChatList();
            
            // Если это сообщение активного чата - добавляем в сообщения
            if(activeConversation && msg.conversation_id===activeConversation.id) {
                if(!messages.find(m=>m.id===msg.id)) {
                    messages.push(msg);
                    renderMessages();
                }
                // Обновляем активный чат
                activeConversation = conversations.find(c => c.id === msg.conversation_id);
            }
        }

        function loadConversations() {
            sendWs({type:'GetConversations'});
            sendWs({type:'GetFriendRequests'});
            sendWs({type:'GetContactsOnline'});
            pollOnlineStatuses();
        }

        function pollOnlineStatuses() {
            if (!wsConnected) return;
            const ids = [];
            conversations.forEach(c => { if (c.other_user?.id) ids.push(String(c.other_user.id)); });
            contacts.forEach(c => { if (c.contact_user_id) ids.push(String(c.contact_user_id)); });
            const uniq = [...new Set(ids)];
            if (uniq.length) sendWs({ type: 'GetOnlineStatus', user_ids: uniq });
        }

        window.loadOlderMessages = function() {
            if (!activeConversation || !hasMoreMessages || messages.length === 0) return;
            const oldest = messages[0];
            if (!oldest || oldest.pending) return;
            loadingOlderMessages = true;
            sendWs({
                type: 'GetMessages',
                conversation_id: activeConversation.id,
                limit: 50,
                before: oldest.created_at
            });
        };

        let onlinePollId = null;
        function startOnlinePoll() {
            if (onlinePollId) clearInterval(onlinePollId);
            onlinePollId = setInterval(pollOnlineStatuses, 20000);
        }
