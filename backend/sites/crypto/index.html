<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoWallet - ZeroDay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f1f5f9;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }

        .tab.active {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border-color: transparent;
        }

        /* Wallet Cards */
        .wallet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .wallet-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .wallet-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .wallet-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .wallet-icon.btc { background: linear-gradient(135deg, #f97316, #ea580c); }
        .wallet-icon.eth { background: linear-gradient(135deg, #6366f1, #4f46e5); }
        .wallet-icon.usdt { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .wallet-icon.zerocoin { background: linear-gradient(135deg, #a855f7, #ec4899); }

        .wallet-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .wallet-balance {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .wallet-currency {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Transactions */
        .transactions {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
        }

        .transactions-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .transaction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .transaction-icon.receive {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .transaction-icon.send {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .transaction-details {
            font-weight: 500;
        }

        .transaction-date {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .transaction-amount.positive {
            color: #22c55e;
        }

        .transaction-amount.negative {
            color: #ef4444;
        }

        /* Register Screen */
        .register-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .register-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .register-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .register-subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #a855f7;
        }

        .register-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border-radius: 12px;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Address Display */
        .address-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .address {
            font-family: monospace;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .copy-btn {
            padding: 8px 16px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            color: #a855f7;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(168, 85, 247, 0.3);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        let token = localStorage.getItem('zeroday.token');
        let wallet = { btc: 0, eth: 0, usdt: 0, zerocoin: 0 };
        let transactions = [];
        let activeTab = 'wallet';

        function getToken() {
            return localStorage.getItem('zeroday.token');
        }

        async function apiRequest(endpoint, options = {}) {
            const token = getToken();
            const response = await fetch(`${API_BASE}${endpoint}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers,
                },
            });
            return response.json();
        }

        function showNotification(message) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();
            
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }

        function renderRegisterScreen() {
            document.getElementById('app').innerHTML = `
                <div class="register-screen">
                    <div class="register-card">
                        <div class="register-icon">💰</div>
                        <h1 class="register-title">CryptoWallet</h1>
                        <p class="register-subtitle">Создайте криптокошелёк для управления цифровыми активами</p>
                        <form id="register-form">
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Пароль</label>
                                <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                            </div>
                            <button type="submit" class="register-btn">Создать кошелёк</button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('register-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                btn.disabled = true;
                btn.textContent = 'Создание...';

                // Имитация регистрации - даём бонус
                wallet = { btc: 0, eth: 0, usdt: 0, zerocoin: 100 };
                transactions = [{
                    id: '1',
                    type: 'receive',
                    amount: 100,
                    currency: 'ZEROCOIN',
                    from: 'ZeroDay Bonus',
                    date: new Date().toISOString(),
                    status: 'completed'
                }];
                
                showNotification('Кошелёк создан! Вам начислено 100 ZEROCOIN');
                renderMainScreen();
            });
        }

        function renderWalletTab() {
            return `
                <div class="wallet-grid">
                    <div class="wallet-card">
                        <div class="wallet-card-header">
                            <div class="wallet-icon btc">₿</div>
                            <div>
                                <div class="wallet-name">Bitcoin</div>
                                <div class="wallet-currency">BTC</div>
                            </div>
                        </div>
                        <div class="wallet-balance">${wallet.btc.toFixed(6)}</div>
                    </div>
                    <div class="wallet-card">
                        <div class="wallet-card-header">
                            <div class="wallet-icon eth">Ξ</div>
                            <div>
                                <div class="wallet-name">Ethereum</div>
                                <div class="wallet-currency">ETH</div>
                            </div>
                        </div>
                        <div class="wallet-balance">${wallet.eth.toFixed(6)}</div>
                    </div>
                    <div class="wallet-card">
                        <div class="wallet-card-header">
                            <div class="wallet-icon usdt">₮</div>
                            <div>
                                <div class="wallet-name">Tether</div>
                                <div class="wallet-currency">USDT</div>
                            </div>
                        </div>
                        <div class="wallet-balance">${wallet.usdt.toFixed(2)}</div>
                    </div>
                    <div class="wallet-card">
                        <div class="wallet-card-header">
                            <div class="wallet-icon zerocoin">🪙</div>
                            <div>
                                <div class="wallet-name">ZeroCoin</div>
                                <div class="wallet-currency">ZERO</div>
                            </div>
                        </div>
                        <div class="wallet-balance">${wallet.zerocoin.toFixed(2)}</div>
                    </div>
                </div>
                
                <div class="transactions">
                    <h2 class="transactions-title">📊 История транзакций</h2>
                    ${transactions.length === 0 ? 
                        '<p style="color: #64748b; text-align: center; padding: 40px;">Нет транзакций</p>' :
                        transactions.map(tx => `
                            <div class="transaction-item">
                                <div class="transaction-info">
                                    <div class="transaction-icon ${tx.type}">
                                        ${tx.type === 'receive' ? '↓' : '↑'}
                                    </div>
                                    <div>
                                        <div class="transaction-details">${tx.type === 'receive' ? 'Получено от' : 'Отправлено'} ${tx.from || tx.to || 'Unknown'}</div>
                                        <div class="transaction-date">${new Date(tx.date).toLocaleDateString('ru-RU')}</div>
                                    </div>
                                </div>
                                <div class="transaction-amount ${tx.type === 'receive' ? 'positive' : 'negative'}">
                                    ${tx.type === 'receive' ? '+' : '-'}${tx.amount} ${tx.currency}
                                </div>
                            </div>
                        `).join('')
                    }
                </div>
            `;
        }

        function renderSendTab() {
            return `
                <div class="transactions">
                    <h2 class="transactions-title">💸 Отправить криптовалюту</h2>
                    <div class="form-group">
                        <label class="form-label">Валюта</label>
                        <select id="send-currency" class="form-input" onchange="console.log('changed')">
                            <option value="btc">Bitcoin (BTC)</option>
                            <option value="eth">Ethereum (ETH)</option>
                            <option value="usdt">Tether (USDT)</option>
                            <option value="zerocoin">ZeroCoin (ZERO)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Адрес получателя</label>
                        <input type="text" id="send-address" class="form-input" placeholder="Введите адрес кошелька">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Сумма</label>
                        <input type="number" id="send-amount" class="form-input" placeholder="0.00" step="0.000001">
                    </div>
                    <button class="btn btn-primary" onclick="sendCrypto()" style="width: 100%">
                        <span>📤</span> Отправить
                    </button>
                </div>
            `;
        }

        function renderReceiveTab() {
            const myAddress = '0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb';
            return `
                <div class="transactions">
                    <h2 class="transactions-title">📥 Получить криптовалюту</h2>
                    <div class="address-box">
                        <span class="address">${myAddress}</span>
                        <button class="copy-btn" onclick="copyAddress('${myAddress}')">Копировать</button>
                    </div>
                    <p style="color: #94a3b8; text-align: center;">
                        Отправьте криптовалюту на этот адрес для пополнения кошелька
                    </p>
                </div>
            `;
        }

        window.copyAddress = function(address) {
            navigator.clipboard.writeText(address);
            showNotification('Адрес скопирован в буфер обмена');
        };

        window.sendCrypto = function() {
            const currency = document.getElementById('send-currency').value;
            const amount = parseFloat(document.getElementById('send-amount').value);
            const address = document.getElementById('send-address').value;
            
            if (!amount || !address) {
                showNotification('Заполните все поля');
                return;
            }
            
            if (wallet[currency] < amount) {
                showNotification('Недостаточно средств');
                return;
            }
            
            wallet[currency] -= amount;
            transactions.unshift({
                id: Date.now().toString(),
                type: 'send',
                amount,
                currency: currency.toUpperCase(),
                to: address,
                date: new Date().toISOString(),
                status: 'completed'
            });
            
            showNotification('Транзакция отправлена!');
            activeTab = 'wallet';
            renderMainScreen();
        };

        function renderMainScreen() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="header">
                        <div class="logo">
                            <div class="logo-icon">💰</div>
                            <span class="logo-text">CryptoWallet</span>
                        </div>
                        <button class="btn btn-secondary" onclick="logout()">
                            <span>🚪</span> Выйти
                        </button>
                    </div>
                    
                    <div class="tabs">
                        <div class="tab ${activeTab === 'wallet' ? 'active' : ''}" onclick="setTab('wallet')">Кошелёк</div>
                        <div class="tab ${activeTab === 'send' ? 'active' : ''}" onclick="setTab('send')">Отправить</div>
                        <div class="tab ${activeTab === 'receive' ? 'active' : ''}" onclick="setTab('receive')">Получить</div>
                        <div class="tab ${activeTab === 'history' ? 'active' : ''}" onclick="setTab('history')">История</div>
                    </div>
                    
                    ${activeTab === 'wallet' ? renderWalletTab() : 
                      activeTab === 'send' ? renderSendTab() :
                      activeTab === 'receive' ? renderReceiveTab() :
                      renderWalletTab()}
                </div>
            `;
        }

        window.setTab = function(tab) {
            activeTab = tab;
            renderMainScreen();
        };

        window.logout = function() {
            wallet = { btc: 0, eth: 0, usdt: 0, zerocoin: 0 };
            transactions = [];
            renderRegisterScreen();
        };

        // Initialize
        if (!token) {
            renderRegisterScreen();
        } else {
            // Проверяем, есть ли уже кошелёк (в реальном приложении - запрос к API)
            const hasWallet = localStorage.getItem('zeroday.wallet');
            if (!hasWallet) {
                renderRegisterScreen();
            } else {
                // Загружаем данные (в реальном приложении - из API)
                const saved = JSON.parse(localStorage.getItem('zeroday.wallet') || '{}');
                wallet = saved.wallet || wallet;
                transactions = saved.transactions || [];
                renderMainScreen();
            }
        }

        // Сохранение при изменении
        const originalSetItem = localStorage.setItem;
        localStorage.setItem = function(key, value) {
            if (key === 'zeroday.wallet') {
                const saved = JSON.parse(value);
                wallet = saved.wallet || wallet;
                transactions = saved.transactions || [];
            }
            originalSetItem.apply(this, arguments);
        };
    </script>
</body>
</html>
