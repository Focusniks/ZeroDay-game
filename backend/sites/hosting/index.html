<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosting - ZeroDay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
        }
        .hero {
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
        }
        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }
        .feature {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        .feature h3 {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .feature p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .plans-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 40px;
        }
        .plans {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .plan {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px;
            position: relative;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
        }
        .plan:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.5);
        }
        .plan.popular {
            border-color: #3b82f6;
        }
        .popular-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .plan-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .plan-price {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .plan-price span {
            font-size: 1rem;
            color: #94a3b8;
        }
        .plan-features {
            list-style: none;
            margin-bottom: 32px;
        }
        .plan-features li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .plan-features li:last-child {
            border-bottom: none;
        }
        .check {
            color: #22c55e;
            font-weight: bold;
        }
        .plan-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .plan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        .plan-btn.purchased {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            max-width: 450px;
            width: 100%;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
        }
        .modal-close:hover {
            color: white;
        }
        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-label {
            font-weight: 500;
            color: #cbd5e1;
        }
        .form-input {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
        }
        .form-input:focus {
            border-color: #3b82f6;
        }
        .modal-submit {
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border-radius: 12px;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
            z-index: 1001;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Конфигурация хостингов - загружается динамически из URL параметров
        const hostingConfigs = {
            cloudpro: {
                name: "CloudPro Hosting",
                gradient: "linear-gradient(135deg, #3b82f6, #06b6d4)",
                description: "Профессиональный хостинг для вашего бизнеса с гарантией 99.9% uptime",
                plans: [
                    { name: "Start", price: 299, storage: "10 GB", bandwidth: "100 GB", features: ["1 сайт", "SSL сертификат", "Email хостинг"] },
                    { name: "Business", price: 599, storage: "50 GB", bandwidth: "500 GB", features: ["10 сайтов", "SSL сертификат", "Приоритетная поддержка", "Daily бэкапы"], popular: true },
                    { name: "Enterprise", price: 1299, storage: "200 GB", bandwidth: "Unlimited", features: ["Безлимит сайтов", "Выделенный IP", "Персональный менеджер", "SLA 99.9%"] },
                ]
            },
            fasthost: {
                name: "FastHost",
                gradient: "linear-gradient(135deg, #a855f7, #ec4899)",
                description: "Скоростной хостинг с NVMe дисками для максимальной производительности",
                plans: [
                    { name: "Lite", price: 199, storage: "5 GB", bandwidth: "50 GB", features: ["1 сайт", "Бесплатный SSL", "Панель управления"] },
                    { name: "Pro", price: 499, storage: "25 GB", bandwidth: "250 GB", features: ["5 сайтов", "CDN включен", "Оптимизация WordPress"], popular: true },
                    { name: "Max", price: 999, storage: "100 GB", bandwidth: "1 TB", features: ["Безлимит сайтов", "VPS мощность", "Git интеграция", "Staging среда"] },
                ]
            },
            securehost: {
                name: "SecureHost",
                gradient: "linear-gradient(135deg, #22c55e, #16a34a)",
                description: "Максимальная безопасность ваших данных с продвинутой защитой от атак",
                plans: [
                    { name: "Basic", price: 349, storage: "15 GB", bandwidth: "150 GB", features: ["2 сайта", "WAF защита", "SSL сертификат", "Anti-DDoS"] },
                    { name: "Secure", price: 749, storage: "75 GB", bandwidth: "750 GB", features: ["15 сайтов", "Malware сканер", "Бэкапы каждый час"], popular: true },
                    { name: "Fortress", price: 1499, storage: "300 GB", bandwidth: "Unlimited", features: ["Безлимит сайтов", "Penetration тесты", "Security аудит", "24/7 мониторинг"] },
                ]
            },
            budgethost: {
                name: "BudgetHost",
                gradient: "linear-gradient(135deg, #f97316, #ef4444)",
                description: "Доступный хостинг без компромиссов в качестве",
                plans: [
                    { name: "Economy", price: 99, storage: "2 GB", bandwidth: "20 GB", features: ["1 сайт", "Панель управления", "1 база данных"] },
                    { name: "Value", price: 249, storage: "10 GB", bandwidth: "100 GB", features: ["3 сайта", "Бесплатный домен", "Неограниченно баз данных"], popular: true },
                    { name: "Deluxe", price: 449, storage: "40 GB", bandwidth: "400 GB", features: ["10 сайтов", "Маркетинг $100", "Бэкапы", "SSL"] },
                ]
            }
        };

        let selectedPlan = null;
        let purchasedPlans = JSON.parse(localStorage.getItem('zeroday.hosting') || '[]');

        function getHostingId() {
            const url = new URL(window.location.href);
            return url.pathname.split('/').filter(p => p)[1] || 'cloudpro';
        }

        function showNotification(message) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();
            
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }

        function render() {
            const hostingId = getHostingId();
            const config = hostingConfigs[hostingId] || hostingConfigs.cloudpro;

            document.getElementById('app').innerHTML = `
                <div class="hero" style="background: ${config.gradient}">
                    <h1>☁️ ${config.name}</h1>
                    <p>${config.description}</p>
                </div>
                
                <div class="container">
                    <div class="features">
                        <div class="feature">
                            <div class="feature-icon">💾</div>
                            <h3>NVMe SSD</h3>
                            <p>Быстрые диски</p>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">🛡️</div>
                            <h3>DDoS защита</h3>
                            <p>24/7 мониторинг</p>
                        </div>
                        <div class="feature">
                            <div class="feature-icon">🎧</div>
                            <h3>Поддержка</h3>
                            <p>Всегда на связи</p>
                        </div>
                    </div>

                    <h2 class="plans-title">Тарифные планы</h2>
                    <div class="plans">
                        ${config.plans.map((plan, index) => `
                            <div class="plan ${plan.popular ? 'popular' : ''}">
                                ${plan.popular ? '<span class="popular-badge">Популярный</span>' : ''}
                                <div class="plan-name">${plan.name}</div>
                                <div class="plan-price">$${plan.price}<span>/мес</span></div>
                                <ul class="plan-features">
                                    <li><span class="check">✓</span> ${plan.storage} хранилище</li>
                                    <li><span class="check">✓</span> ${plan.bandwidth} трафик</li>
                                    ${plan.features.map(f => `<li><span class="check">✓</span> ${f}</li>`).join('')}
                                </ul>
                                <button class="plan-btn ${purchasedPlans.includes(plan.name) ? 'purchased' : ''}" 
                                        onclick="openModal('${plan.name}', ${plan.price})">
                                    ${purchasedPlans.includes(plan.name) ? '✓ Куплено' : 'Выбрать план'}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="modal-overlay" id="modal">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 class="modal-title">Оформление заказа</h3>
                            <button class="modal-close" onclick="closeModal()">×</button>
                        </div>
                        <div class="modal-form">
                            <div class="form-group">
                                <label class="form-label">Тариф</label>
                                <input type="text" class="form-input" id="modal-plan-name" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-input" placeholder="you@example.com" id="modal-email">
                            </div>
                            <button class="modal-submit" onclick="purchase()">
                                Оплатить <span id="modal-price"></span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.openModal = function(planName, price) {
            selectedPlan = { name: planName, price: price };
            document.getElementById('modal-plan-name').value = planName;
            document.getElementById('modal-price').textContent = `$${price}`;
            document.getElementById('modal').classList.add('active');
        };

        window.closeModal = function() {
            document.getElementById('modal').classList.remove('active');
            selectedPlan = null;
        };

        window.purchase = function() {
            const email = document.getElementById('modal-email').value;
            if (!email || !selectedPlan) {
                showNotification('Заполните email');
                return;
            }

            // Сохраняем покупку
            if (!purchasedPlans.includes(selectedPlan.name)) {
                purchasedPlans.push(selectedPlan.name);
                localStorage.setItem('zeroday.hosting', JSON.stringify(purchasedPlans));
            }

            showNotification(`✓ ${selectedPlan.name} успешно приобретён!`);
            closeModal();
            render();
        };

        // Close modal on overlay click
        document.getElementById('modal')?.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Initial render
        render();
    </script>
</body>
</html>
