<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a" />
      <stop offset="0.45" stop-color="#071126" />
      <stop offset="1" stop-color="#05060a" />
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.55" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="280" cy="160" r="220" fill="#22d3ee" opacity="0.12"/>
  <circle cx="980" cy="120" r="180" fill="#3b82f6" opacity="0.10"/>
  <circle cx="760" cy="560" r="260" fill="#10b981" opacity="0.08"/>

  <!-- Fake terminal window -->
  <rect x="80" y="80" width="1040" height="540" rx="28" fill="#05060a" opacity="0.75" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="80" y="80" width="1040" height="70" rx="28" fill="#0a1122" opacity="0.65"/>
  <g opacity="0.7">
    <circle cx="140" cy="115" r="10" fill="#22d3ee"/>
    <circle cx="175" cy="115" r="10" fill="#3b82f6"/>
    <circle cx="210" cy="115" r="10" fill="#10b981"/>
  </g>

  <!-- Grid lines -->
  <g opacity="0.22" stroke="#22d3ee" stroke-width="1">
    <path d="M120 210 H1080"/>
    <path d="M120 260 H1080"/>
    <path d="M120 310 H1080"/>
    <path d="M120 360 H1080"/>
    <path d="M120 410 H1080"/>
    <path d="M120 460 H1080"/>
    <path d="M120 510 H1080"/>
  </g>

  <!-- Neon scan -->
  <g filter="url(#softGlow)">
    <path d="M130 180 L420 190 L720 170 L1070 200" fill="none" stroke="url(#neon)" stroke-width="6" opacity="0.55" stroke-linecap="round"/>
    <path d="M120 490 L420 470 L760 520 L1080 480" fill="none" stroke="url(#neon)" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Code-ish text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" fill="#dbeafe" opacity="0.9">
    <text x="125" y="255">&gt; netscanner --target 172.16.x.x --mode trace</text>
    <text x="125" y="300">[+] services: ftp(virtual), web(constructed), api(sim)</text>
    <text x="125" y="345">[~] reputation: rising (ip traces detected)</text>
    <text x="125" y="390">[!] ids/ips: monitoring traffic... (in-game)</text>
    <text x="125" y="435">[+] exploit-chains: assembled (sandbox only)</text>
    <text x="125" y="480">[+] traceback: ready — quick jump window</text>
  </g>

  <!-- Footer bar -->
  <rect x="80" y="605" width="1040" height="20" rx="10" fill="#0b1020" opacity="0.8" />
  <rect x="80" y="605" width="420" height="20" rx="10" fill="url(#neon)" opacity="0.35" />
</svg>

