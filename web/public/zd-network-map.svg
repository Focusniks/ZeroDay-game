<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#05060a"/>
  <g opacity="0.18" stroke="#22d3ee" stroke-width="1">
    <path d="M40 90 H760"/>
    <path d="M40 140 H760"/>
    <path d="M40 190 H760"/>
    <path d="M40 240 H760"/>
    <path d="M40 290 H760"/>
    <path d="M40 340 H760"/>
    <path d="M40 390 H760"/>
  </g>

  <g filter="url(#glow)">
    <path d="M120 160 C220 60, 360 90, 420 170 C470 240, 600 230, 670 300" fill="none" stroke="url(#neon)" stroke-width="4" opacity="0.65" stroke-linecap="round"/>
    <path d="M130 310 C240 260, 320 260, 410 340 C500 420, 610 380, 700 410" fill="none" stroke="url(#neon)" stroke-width="3.5" opacity="0.45" stroke-linecap="round"/>
    <path d="M170 240 C260 220, 320 150, 420 150 C520 150, 560 210, 640 240" fill="none" stroke="url(#neon)" stroke-width="3.5" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Nodes -->

  <g filter="url(#glow)">
    <circle cx="120" cy="160" r="18" fill="#22d3ee" opacity="0.12"/>
    <circle cx="120" cy="160" r="6" fill="#22d3ee"/>
    <circle cx="420" cy="170" r="18" fill="#3b82f6" opacity="0.10"/>
    <circle cx="420" cy="170" r="6" fill="#3b82f6"/>
    <circle cx="670" cy="300" r="18" fill="#10b981" opacity="0.10"/>
    <circle cx="670" cy="300" r="6" fill="#10b981"/>
    <circle cx="130" cy="310" r="18" fill="#22d3ee" opacity="0.10"/>
    <circle cx="130" cy="310" r="6" fill="#22d3ee"/>
    <circle cx="410" cy="340" r="18" fill="#3b82f6" opacity="0.10"/>
    <circle cx="410" cy="340" r="6" fill="#3b82f6"/>
    <circle cx="700" cy="410" r="18" fill="#10b981" opacity="0.10"/>
    <circle cx="700" cy="410" r="6" fill="#10b981"/>
    <circle cx="170" cy="240" r="16" fill="#3b82f6" opacity="0.09"/>
    <circle cx="170" cy="240" r="5" fill="#3b82f6"/>
    <circle cx="640" cy="240" r="16" fill="#22d3ee" opacity="0.08"/>
    <circle cx="640" cy="240" r="5" fill="#22d3ee"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#dbeafe" opacity="0.85">
    <text x="42" y="70">netscanner: route graph (sandbox)</text>
    <text x="42" y="455" fill="#93c5fd">ip reputation: 0x7A (sim)</text>
  </g>
</svg>

