<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="#05060a"/>
  <circle cx="240" cy="140" r="190" fill="#22d3ee" opacity="0.08"/>
  <circle cx="780" cy="160" r="150" fill="#3b82f6" opacity="0.07"/>

  <!-- Flag pole -->
  <g>
    <rect x="120" y="90" width="16" height="330" rx="8" fill="#0b1020" opacity="0.9"/>
    <rect x="110" y="98" width="36" height="12" rx="6" fill="url(#neon)" opacity="0.35"/>
  </g>

  <!-- Flag -->
  <g filter="url(#glow)">
    <path
      d="M140 140 C280 90, 420 170, 560 120 C650 90, 720 105, 760 130 L760 310 C720 280, 640 270, 540 300 C420 340, 290 260, 140 320 Z"
      fill="#070912"
      opacity="0.68"
      stroke="url(#neon)"
      stroke-width="5"
    />
    <path d="M165 215 C310 160, 420 250, 570 200 C670 170, 740 185, 755 195" fill="none" stroke="url(#neon)" stroke-width="6" opacity="0.35" stroke-linecap="round"/>
    <path d="M165 260 C300 220, 420 300, 560 260 C660 235, 740 245, 755 255" fill="none" stroke="url(#neon)" stroke-width="5" opacity="0.25" stroke-linecap="round"/>
  </g>

  <!-- CTF cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#dbeafe">
    <rect x="110" y="360" width="300" height="76" rx="20" fill="#070912" opacity="0.65" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="140" y="410" font-size="18" opacity="0.9">ctf://weekly-race</text>

    <rect x="430" y="360" width="360" height="76" rx="20" fill="#070912" opacity="0.65" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="460" y="395" font-size="18" opacity="0.9">scoreboard: updated (sim)</text>
    <text x="460" y="420" font-size="15" opacity="0.7">prize: crypto-cash (game)</text>
  </g>
</svg>

