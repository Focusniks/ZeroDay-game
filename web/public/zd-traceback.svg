<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="#05060a"/>
  <circle cx="220" cy="120" r="180" fill="#22d3ee" opacity="0.10"/>
  <circle cx="760" cy="120" r="140" fill="#3b82f6" opacity="0.08"/>

  <!-- Log panel -->
  <rect x="70" y="90" width="760" height="340" rx="26" fill="#070912" opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Timeline -->
  <g transform="translate(120,160)">
    <rect x="0" y="190" width="660" height="14" rx="7" fill="#0b1020" opacity="0.85"/>
    <rect x="0" y="190" width="280" height="14" rx="7" fill="url(#neon)" opacity="0.25"/>
    <rect x="290" y="190" width="120" height="14" rx="7" fill="#f43f5e" opacity="0.22"/>
    <rect x="430" y="190" width="230" height="14" rx="7" fill="url(#neon)" opacity="0.18"/>

    <g filter="url(#glow)">
      <rect x="330" y="170" width="14" height="54" rx="7" fill="#f87171" opacity="0.75"/>
      <rect x="330" y="170" width="6" height="54" rx="3" fill="#fca5a5" opacity="0.8"/>
    </g>

    <g opacity="0.22" stroke="#22d3ee" stroke-width="2">
      <path d="M0 110 C70 80, 160 80, 240 110 C320 140, 420 150, 660 90" fill="none" />
      <path d="M0 70 C90 40, 210 40, 320 65 C430 90, 520 115, 660 55" fill="none" />
    </g>
  </g>

  <!-- Text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#dbeafe" opacity="0.9">
    <text x="105" y="140">traceback: collecting logs… (sim)</text>
    <text x="105" y="185">proxy-chain: hop #1 ok</text>
    <text x="105" y="225">ids/ips: anomaly detected</text>
    <text x="105" y="265">red zone: quick jump window</text>
  </g>

  <!-- Footer -->
  <rect x="70" y="430" width="760" height="18" rx="9" fill="#0b1020" opacity="0.75"/>
  <rect x="70" y="430" width="340" height="18" rx="9" fill="url(#neon)" opacity="0.22"/>
</svg>

