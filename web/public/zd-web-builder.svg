<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="#05060a"/>
  <circle cx="210" cy="110" r="160" fill="#22d3ee" opacity="0.10"/>
  <circle cx="760" cy="120" r="140" fill="#3b82f6" opacity="0.10"/>

  <!-- Browser frame -->
  <rect x="70" y="70" width="760" height="380" rx="26" fill="#070912" opacity="0.75" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="70" y="70" width="760" height="62" rx="26" fill="#0b1020" opacity="0.75"/>

  <!-- Tabs -->
  <g opacity="0.7">
    <circle cx="120" cy="101" r="10" fill="#22d3ee"/>
    <circle cx="155" cy="101" r="10" fill="#3b82f6"/>
    <circle cx="190" cy="101" r="10" fill="#10b981"/>
  </g>

  <!-- Code panes -->
  <rect x="95" y="150" width="310" height="290" rx="18" fill="#05060a" opacity="0.55" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="425" y="150" width="410" height="290" rx="18" fill="#05060a" opacity="0.35" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Left code lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#dbeafe" opacity="0.9">
    <text x="120" y="198">&lt;HackSite&gt;</text>
    <text x="120" y="235">&lt;header class="neon"&gt;</text>
    <text x="120" y="272">  &lt;nav&gt;Network / Web / Social&lt;/nav&gt;</text>
    <text x="120" y="309">&lt;/header&gt;</text>
    <text x="120" y="346">&lt;div class="bento"&gt;…&lt;/div&gt;</text>
    <text x="120" y="383">&lt;/HackSite&gt;</text>
  </g>

  <!-- Right preview card -->
  <g filter="url(#glow)">
    <rect x="450" y="200" width="360" height="120" rx="18" fill="url(#neon)" opacity="0.20"/>
    <rect x="450" y="340" width="360" height="90" rx="18" fill="url(#neon)" opacity="0.14"/>
    <path d="M470 250 H760" stroke="url(#neon)" stroke-width="8" opacity="0.55" stroke-linecap="round"/>
    <path d="M470 300 H640" stroke="url(#neon)" stroke-width="6" opacity="0.45" stroke-linecap="round"/>
    <path d="M470 385 H770" stroke="url(#neon)" stroke-width="7" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Bottom hint -->
  <rect x="70" y="460" width="760" height="18" rx="9" fill="#0b1020" opacity="0.75"/>
  <rect x="70" y="460" width="330" height="18" rx="9" fill="url(#neon)" opacity="0.30"/>
</svg>

