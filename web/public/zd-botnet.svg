<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="#05060a"/>
  <circle cx="240" cy="140" r="190" fill="#22d3ee" opacity="0.08"/>
  <circle cx="780" cy="160" r="170" fill="#3b82f6" opacity="0.06"/>

  <!-- Nodes -->
  <g filter="url(#glow)">
    <circle cx="230" cy="200" r="16" fill="#22d3ee" opacity="0.85"/>
    <circle cx="360" cy="160" r="16" fill="#3b82f6" opacity="0.85"/>
    <circle cx="520" cy="190" r="16" fill="#10b981" opacity="0.85"/>
    <circle cx="660" cy="150" r="16" fill="#22d3ee" opacity="0.75"/>
    <circle cx="690" cy="280" r="16" fill="#3b82f6" opacity="0.75"/>
    <circle cx="470" cy="300" r="16" fill="#10b981" opacity="0.7"/>
    <circle cx="320" cy="300" r="16" fill="#22d3ee" opacity="0.65"/>
  </g>

  <!-- Connections -->
  <g opacity="0.45" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M230 200 L360 160 L520 190 L660 150" />
    <path d="M360 160 L470 300 L320 300" />
    <path d="M520 190 L690 280 L470 300" />
    <path d="M660 150 L690 280" />
  </g>

  <!-- Bot devices (rectangles) -->
  <g>
    <rect x="120" y="120" width="180" height="90" rx="18" fill="#070912" opacity="0.65" stroke="#fff" stroke-opacity="0.08"/>
    <rect x="290" y="110" width="180" height="90" rx="18" fill="#070912" opacity="0.55" stroke="#fff" stroke-opacity="0.08"/>
    <rect x="460" y="130" width="220" height="100" rx="18" fill="#070912" opacity="0.50" stroke="#fff" stroke-opacity="0.08"/>
    <rect x="180" y="260" width="240" height="110" rx="18" fill="#070912" opacity="0.48" stroke="#fff" stroke-opacity="0.08"/>
    <rect x="470" y="260" width="310" height="120" rx="18" fill="#070912" opacity="0.45" stroke="#fff" stroke-opacity="0.08"/>
  </g>

  <!-- Text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#dbeafe" opacity="0.9">
    <text x="105" y="475" opacity="0.75">botnet: npc-infection (sim)</text>
    <text x="105" y="448">rented-powers: ready (game)</text>
    <text x="105" y="420">mining: controlled output (sim)</text>
  </g>
</svg>

